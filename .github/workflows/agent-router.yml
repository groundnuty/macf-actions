name: Agent Router (reusable)

# Callable reusable workflow. Consumers trigger it from their own workflow
# via `jobs.<id>.uses: groundnuty/macf-actions/.github/workflows/agent-router.yml@v1`.
# Events (issues, issue_comment, pull_request, pull_request_review) are declared
# in the caller, not here.

on:
  workflow_call:
    secrets:
      AGENT_SSH_KEY:
        description: SSH key for connecting to agent hosts
        required: true
      TS_OAUTH_CLIENT_ID:
        description: Tailscale OAuth client ID for the GitHub Actions runner
        required: true
      TS_OAUTH_SECRET:
        description: Tailscale OAuth secret for the GitHub Actions runner
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read
  # checks: read needed by route-by-ci-completion (#6) to enumerate
  # check_runs in the completed suite so the notification can name the
  # first failing check (not just "CI failed").
  checks: read

# macf-actions#49 — self-hosted-runner enablement (A/B switchable, inert by default):
#   • `runs-on` is parameterized via the consumer-repo variable MACF_ROUTING_RUNS_ON.
#     Unset → 'ubuntu-latest' (GitHub-hosted; behavior unchanged). To run routing on a
#     VM-local self-hosted runner, set it to a JSON array of runner labels, e.g.
#     MACF_ROUTING_RUNS_ON='["self-hosted","macf-vm"]' (the devops runner-registration
#     label); fromJSON parses it.
#   • On a self-hosted runner the Tailscale connect + readiness-poll steps are skipped
#     (`if: runner.environment != 'self-hosted'`): the VM is already on the tailnet via
#     its own tailscaled, so routing SSH reaches the agent without the hosted-runner
#     join — eliminating the ~22s Tailscale tax. The existing SSH send path serves BOTH
#     arms (the AC-accepted lower-diff fallback); a separate no-SSH direct-helper inject
#     (calling tmux-send-to-claude.sh on the runner) can follow if wanted. The #47
#     prompt-injection hardening (base64 data-passing) is the security prereq + is in.

jobs:

  # ─── LOAD CONFIG ───
  config:
    runs-on: ${{ vars.MACF_ROUTING_RUNS_ON && fromJSON(vars.MACF_ROUTING_RUNS_ON) || 'ubuntu-latest' }}
    outputs:
      agents: ${{ steps.load.outputs.agents }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/agent-config.json
          sparse-checkout-cone-mode: false

      - name: Load config
        id: load
        run: |
          echo "agents=$(jq -c '.agents' .github/agent-config.json)" >> "$GITHUB_OUTPUT"

  # ─── LABEL ROUTING ───
  route-by-label:
    needs: config
    if: >
      (github.event_name == 'issues') &&
      (github.event.action == 'labeled') &&
      (github.actor != 'github-actions[bot]')
    runs-on: ${{ vars.MACF_ROUTING_RUNS_ON && fromJSON(vars.MACF_ROUTING_RUNS_ON) || 'ubuntu-latest' }}
    env:
      AGENT_SSH_KEY: ${{ secrets.AGENT_SSH_KEY }}
      # macf#444 Option D: route-run id for the turn-ack correlation marker.
      ROUTE_RUN_ID: ${{ github.run_id }}
      AGENTS: ${{ needs.config.outputs.agents }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Connect to Tailscale
        # macf-actions#49: the VM-local self-hosted runner is already on the
        # tailnet via the host's tailscaled, so a hosted-runner join is
        # unnecessary there — skip this + the readiness poll below. The route
        # step's SSH then reaches the agent over the host's existing tailscaled
        # (the AC-blessed lower-diff path; no separate no-SSH inject branch).
        if: runner.environment != 'self-hosted'
        # macf-actions#42: pinned to v4.1.2 (newest) by commit SHA per the
        # no-floating-tags directive. v4 adds native binary caching (use-cache,
        # default true → the "cache the Tailscale binary" AC, cleaner than an
        # actions/cache hack) + `tailscale up` retry. Inputs verified unchanged
        # from v3 at this SHA (oauth-client-id / oauth-secret / tags).
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
          use-cache: true

      - name: Wait for Tailscale network (poll readiness, fail-loud)
        if: runner.environment != 'self-hosted'  # macf-actions#49: skip on the VM runner (already on the tailnet)
        run: |
          set -euo pipefail
          # macf-actions#42: replace the blind `sleep 10` with a result-invariant
          # readiness poll (Pattern A, silent-fallback-hazards.md). Assert the local
          # tailnet backend is Running AND this node is Online before any tailnet op;
          # FAIL LOUD on timeout instead of proceeding into a cryptic curl/ssh failure
          # (Instance-9 defense, #48). Same assert shape as macf's route-reconciler.yml
          # "Verify tailnet is up". Typically ready in ~1-2s vs the old fixed 10s.
          for i in $(seq 1 30); do
            json=$(tailscale status --json 2>/dev/null || echo '{}')
            state=$(printf '%s' "$json" | jq -r '.BackendState // "Unknown"')
            online=$(printf '%s' "$json" | jq -r '.Self.Online // false')
            if [ "$state" = "Running" ] && [ "$online" = "true" ]; then
              echo "Tailscale ready after ${i}s (BackendState=Running, Self.Online=true)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Tailscale not ready after 30s (BackendState=${state}, Self.Online=${online}). The tailnet never came up — routing would fail. Check TS_OAUTH_* secrets + the tag:ci-runner ACL." >&2
              exit 1
            fi
            sleep 1
          done

      - name: Route to agent by label
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail

          LABEL="$EVENT_LABEL"
          HOST=$(echo "$AGENTS" | jq -r --arg l "$LABEL" '.[$l].host // empty')
          if [ -z "$HOST" ]; then
            echo "Label '$LABEL' is not an agent label, skipping"
            exit 0
          fi

          APP_NAME=$(echo "$AGENTS" | jq -r --arg l "$LABEL" '.[$l].app_name // empty')
          if [ "$ACTOR" = "${APP_NAME}[bot]" ]; then
            echo "Actor is the same agent, skipping self-routing"
            exit 0
          fi

          SESSION=$(echo "$AGENTS" | jq -r --arg l "$LABEL" '.[$l].tmux_session')
          WINDOW=$(echo "$AGENTS" | jq -r --arg l "$LABEL" '.[$l].tmux_window // empty')
          SSH_USER=$(echo "$AGENTS" | jq -r --arg l "$LABEL" '.[$l].ssh_user')
          TMUX_BIN=$(echo "$AGENTS" | jq -r --arg l "$LABEL" '.[$l].tmux_bin // "tmux"')
          WORKSPACE_DIR=$(echo "$AGENTS" | jq -r --arg l "$LABEL" '.[$l].workspace_dir // empty')

          # Build the tmux target: "session" or "session:window" if a
          # tmux_window is configured. Lets multiple peers of one project
          # share a session with per-agent windows (see groundnuty/macf#69).
          if [ -n "$WINDOW" ]; then
            TARGET="${SESSION}:${WINDOW}"
          else
            TARGET="$SESSION"
          fi

          # macf#444 Option D: trailing route-correlation marker (run_id:agent)
          # for the turn-ack receipt join; the agent ignores the tag.
          PROMPT="Please work on issue #${ISSUE_NUMBER}. Run: gh issue view ${ISSUE_NUMBER} --repo ${GITHUB_REPOSITORY} --json title,body,labels,comments [macf-route:${ROUTE_RUN_ID}:${LABEL}]"

          # macf-actions#47: send the prompt as opaque base64 DATA — decoded into a
          # quoted var on the remote, NEVER interpolated into the remote shell /
          # send-keys string. base64 is [A-Za-z0-9+/=] (shell-inert), so the value
          # carries event-derived text (here the LABEL; PR_TITLE on other jobs)
          # with zero quoting/escaping discipline. Uniform across all send paths so
          # a future free-text addition can't reopen the class. Decode = `base64 -d`
          # (GNU; the substrate remote is Linux).
          PROMPT_B64=$(printf '%s' "$PROMPT" | base64 | tr -d '\n')

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$AGENT_SSH_KEY" > ~/.ssh/id_agent
          chmod 600 ~/.ssh/id_agent

          # Prefer the canonical helper at $WORKSPACE_DIR/.claude/scripts/tmux-send-to-claude.sh
          # (shipped by groundnuty/macf:scripts/ and distributed by macf init
          # / macf update). Falls back to the inline submit pattern for
          # configs without workspace_dir (pre-v1.2 schema). The fallback
          # is kept in lock-step with the helper contents — keep the two
          # in sync. See groundnuty/macf#71.
          #
          # The prompt rides as $PROMPT_B64 (base64, computed above) and is
          # decoded into a quoted remote var (`PROMPT`) before being handed to
          # the helper / send-keys as argv — it is NEVER interpolated into the
          # remote command string (macf-actions#47). $TARGET / $HELPER are
          # operator-config values (agent-config.json), not event-derived.
          # Probe liveness with retry (groundnuty/macf#437 cause 2) — see the
          # alive/absent/unknown rationale. For label-routing, a GENUINE absent
          # marks the issue agent-offline (picked up on the agent's next start);
          # on unknown (transient probe error) we attempt delivery rather than
          # mislabel a live agent offline. (SSH stderr is `2>/dev/null`'d, so PROBE is exactly `rc=N`.)
          SESSION_STATE=unknown
          for probe_attempt in 1 2 3; do
            # `|| true`: an ssh transport failure (exit 255, empty stdout) must NOT
            # abort the step under `set -euo pipefail` — leave PROBE empty so it
            # falls to the retry arm (groundnuty/macf#437 PR #44 review blocker).
            PROBE=$(ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
              "${TMUX_BIN} has-session -t ${SESSION} >/dev/null 2>&1; echo rc=\$?" 2>/dev/null) || true
            # rc=0 alive; rc=1 genuine no-session (absent); anything else (empty=
            # ssh-fail, rc=127=tmux-missing) → unknown → retry → attempt.
            case "$PROBE" in
              rc=0) SESSION_STATE=alive; break ;;
              rc=1) SESSION_STATE=absent; break ;;
              *)    if [ "$probe_attempt" -lt 3 ]; then sleep 3; fi ;;
            esac
          done

          if [ "$SESSION_STATE" = "absent" ]; then
            echo "Agent ${LABEL} session not found (offline); marking agent-offline"
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "agent-offline"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Agent \`${APP_NAME}[bot]\` is offline. Issue will be picked up when the agent starts."
          else
            HELPER="${WORKSPACE_DIR}/.claude/scripts/tmux-send-to-claude.sh"
            HELPER_OK=no
            if [ -n "$WORKSPACE_DIR" ] && ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" "test -x '${HELPER}'" 2>/dev/null; then
              HELPER_OK=yes
            fi
            if [ "$HELPER_OK" = "yes" ] && ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
              "PROMPT=\$(printf %s '${PROMPT_B64}' | base64 -d) && '${HELPER}' '${TARGET}' \"\$PROMPT\""; then
              echo "Routed issue #${ISSUE_NUMBER} to ${LABEL} via helper (target=${TARGET}, session=${SESSION_STATE})"
            elif ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
              "PROMPT=\$(printf %s '${PROMPT_B64}' | base64 -d) \
                && ${TMUX_BIN} send-keys -t ${TARGET} C-u \
                && ${TMUX_BIN} send-keys -t ${TARGET} \"\$PROMPT\" Enter \
                && sleep 1 \
                && ${TMUX_BIN} send-keys -t ${TARGET} Enter"; then
              echo "Routed issue #${ISSUE_NUMBER} to ${LABEL} via inline (target=${TARGET}, session=${SESSION_STATE})"
            else
              echo "Agent ${LABEL} delivery FAILED after probe=${SESSION_STATE} (attempted, not silently offline-skipped)"
            fi
          fi

  # ─── @MENTION ROUTING ───
  route-by-mention:
    needs: config
    if: >
      (github.event_name == 'issue_comment') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'pull_request_review')
    runs-on: ${{ vars.MACF_ROUTING_RUNS_ON && fromJSON(vars.MACF_ROUTING_RUNS_ON) || 'ubuntu-latest' }}
    env:
      AGENT_SSH_KEY: ${{ secrets.AGENT_SSH_KEY }}
      # macf#444 Option D: route-run id for the turn-ack correlation marker.
      ROUTE_RUN_ID: ${{ github.run_id }}
      AGENTS: ${{ needs.config.outputs.agents }}
    steps:
      - name: Connect to Tailscale
        # macf-actions#49: the VM-local self-hosted runner is already on the
        # tailnet via the host's tailscaled, so a hosted-runner join is
        # unnecessary there — skip this + the readiness poll below. The route
        # step's SSH then reaches the agent over the host's existing tailscaled
        # (the AC-blessed lower-diff path; no separate no-SSH inject branch).
        if: runner.environment != 'self-hosted'
        # macf-actions#42: pinned to v4.1.2 (newest) by commit SHA per the
        # no-floating-tags directive. v4 adds native binary caching (use-cache,
        # default true → the "cache the Tailscale binary" AC, cleaner than an
        # actions/cache hack) + `tailscale up` retry. Inputs verified unchanged
        # from v3 at this SHA (oauth-client-id / oauth-secret / tags).
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
          use-cache: true

      - name: Wait for Tailscale network (poll readiness, fail-loud)
        if: runner.environment != 'self-hosted'  # macf-actions#49: skip on the VM runner (already on the tailnet)
        run: |
          set -euo pipefail
          # macf-actions#42: replace the blind `sleep 10` with a result-invariant
          # readiness poll (Pattern A, silent-fallback-hazards.md). Assert the local
          # tailnet backend is Running AND this node is Online before any tailnet op;
          # FAIL LOUD on timeout instead of proceeding into a cryptic curl/ssh failure
          # (Instance-9 defense, #48). Same assert shape as macf's route-reconciler.yml
          # "Verify tailnet is up". Typically ready in ~1-2s vs the old fixed 10s.
          for i in $(seq 1 30); do
            json=$(tailscale status --json 2>/dev/null || echo '{}')
            state=$(printf '%s' "$json" | jq -r '.BackendState // "Unknown"')
            online=$(printf '%s' "$json" | jq -r '.Self.Online // false')
            if [ "$state" = "Running" ] && [ "$online" = "true" ]; then
              echo "Tailscale ready after ${i}s (BackendState=Running, Self.Online=true)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Tailscale not ready after 30s (BackendState=${state}, Self.Online=${online}). The tailnet never came up — routing would fail. Check TS_OAUTH_* secrets + the tag:ci-runner ACL." >&2
              exit 1
            fi
            sleep 1
          done

      - name: Route to mentioned agents
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          REVIEW_USER: ${{ github.event.review.user.login }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            BODY="$COMMENT_BODY"
            ACTOR="$COMMENT_USER"
            REF="issue #${ISSUE_NUMBER}"
            VIEW_NUM="$ISSUE_NUMBER"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            BODY="$PR_BODY"
            ACTOR="$PR_USER"
            REF="PR #${PR_NUMBER}"
            VIEW_NUM="$PR_NUMBER"
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            BODY="$REVIEW_BODY"
            ACTOR="$REVIEW_USER"
            REF="PR #${PR_NUMBER}"
            VIEW_NUM="$PR_NUMBER"
          else
            BODY="$COMMENT_BODY"
            ACTOR="$COMMENT_USER"
            REF="PR #${PR_NUMBER}"
            VIEW_NUM="$PR_NUMBER"
          fi

          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "Comment from github-actions[bot], skipping"
            exit 0
          fi

          for AGENT_NAME in $(echo "$AGENTS" | jq -r 'keys[]'); do
            APP_NAME=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].app_name // empty')

            if [ "$ACTOR" = "${APP_NAME}[bot]" ]; then
              continue
            fi

            if echo "$BODY" | grep -qE "@(${AGENT_NAME}|${APP_NAME})\[bot\]"; then
              HOST=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].host')
              SESSION=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].tmux_session')
              WINDOW=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].tmux_window // empty')
              SSH_USER=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].ssh_user')
              TMUX_BIN=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].tmux_bin // "tmux"')
              WORKSPACE_DIR=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].workspace_dir // empty')

              # Same session/window target construction as route-by-label.
              if [ -n "$WINDOW" ]; then
                TARGET="${SESSION}:${WINDOW}"
              else
                TARGET="$SESSION"
              fi

              # macf#444 Option D: trailing route-correlation marker (run_id:agent).
              MENTION_PROMPT="You were mentioned in ${REF}. Please check and respond: gh issue view ${VIEW_NUM} --repo ${REPO} --json title,body,comments [macf-route:${ROUTE_RUN_ID}:${AGENT_NAME}]"
              # macf-actions#47: send the prompt as opaque base64 DATA, decoded into
              # a quoted remote var — never interpolated into the remote command
              # (see route-by-label for the full rationale). ${REF} is event-derived.
              MENTION_PROMPT_B64=$(printf '%s' "$MENTION_PROMPT" | base64 | tr -d '\n')

              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              echo "$AGENT_SSH_KEY" > ~/.ssh/id_agent
              chmod 600 ~/.ssh/id_agent

              # Helper invocation path (see route-by-label for rationale).
              # Falls back to inline when workspace_dir is unset or the
              # helper isn't executable at that path.
              # Probe liveness with retry (groundnuty/macf#437 cause 2): classify
              # alive / absent / unknown; only a genuine "no session" (absent)
              # skips. On unknown (the probe itself errored) we still ATTEMPT
              # delivery — a duplicate ping is recoverable; a dropped one strands
              # a PR. (SSH stderr is `2>/dev/null`'d, so PROBE is exactly `rc=N`.)
              SESSION_STATE=unknown
              for probe_attempt in 1 2 3; do
                # `|| true`: an ssh transport failure (exit 255, empty stdout) must
                # NOT abort the step under `set -euo pipefail` — leave PROBE empty
                # so it falls to the retry arm (groundnuty/macf#437 PR #44 review).
                PROBE=$(ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
                  -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
                  "${TMUX_BIN} has-session -t ${SESSION} >/dev/null 2>&1; echo rc=\$?" 2>/dev/null) || true
                # rc=0 alive; rc=1 genuine no-session (absent); anything else
                # (empty=ssh-fail, rc=127=tmux-missing) → unknown → retry → attempt.
                case "$PROBE" in
                  rc=0) SESSION_STATE=alive; break ;;
                  rc=1) SESSION_STATE=absent; break ;;
                  *)    if [ "$probe_attempt" -lt 3 ]; then sleep 3; fi ;;
                esac
              done

              if [ "$SESSION_STATE" = "absent" ]; then
                echo "Agent ${AGENT_NAME} session not found (offline), skipping"
              else
                HELPER="${WORKSPACE_DIR}/.claude/scripts/tmux-send-to-claude.sh"
                HELPER_OK=no
                if [ -n "$WORKSPACE_DIR" ] && ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
                  -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" "test -x '${HELPER}'" 2>/dev/null; then
                  HELPER_OK=yes
                fi
                if [ "$HELPER_OK" = "yes" ] && ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
                  -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
                  "PROMPT=\$(printf %s '${MENTION_PROMPT_B64}' | base64 -d) && '${HELPER}' '${TARGET}' \"\$PROMPT\""; then
                  echo "Routed mention to ${AGENT_NAME} via helper (target=${TARGET}, session=${SESSION_STATE})"
                elif ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
                  -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
                  "PROMPT=\$(printf %s '${MENTION_PROMPT_B64}' | base64 -d) \
                    && ${TMUX_BIN} send-keys -t ${TARGET} C-u \
                    && ${TMUX_BIN} send-keys -t ${TARGET} \"\$PROMPT\" Enter \
                    && sleep 1 \
                    && ${TMUX_BIN} send-keys -t ${TARGET} Enter"; then
                  echo "Routed mention to ${AGENT_NAME} via inline (target=${TARGET}, session=${SESSION_STATE})"
                else
                  echo "Agent ${AGENT_NAME} delivery FAILED after probe=${SESSION_STATE} (attempted, not silently offline-skipped)"
                fi
              fi
            fi
          done

  # ─── CI COMPLETION ROUTING ───
  #
  # When a check_suite completes on a PR authored by one of our registered
  # agents, notify the agent in its tmux session so it can merge (on
  # success) or investigate (on failure) without polling. See #6.
  #
  # Fires once per check_suite.completed event. A repo with multiple CI
  # workflows may produce multiple completed suites per commit (one per
  # app). We accept this minor duplication rather than try to aggregate —
  # the alternative is a timer-based cross-suite coalescer which is
  # substantially more complex and adds latency.
  route-by-ci-completion:
    needs: config
    if: >
      (github.event_name == 'check_suite') &&
      (github.event.action == 'completed')
    runs-on: ${{ vars.MACF_ROUTING_RUNS_ON && fromJSON(vars.MACF_ROUTING_RUNS_ON) || 'ubuntu-latest' }}
    env:
      AGENT_SSH_KEY: ${{ secrets.AGENT_SSH_KEY }}
      # macf#444 Option D: route-run id for the turn-ack correlation marker.
      ROUTE_RUN_ID: ${{ github.run_id }}
      AGENTS: ${{ needs.config.outputs.agents }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHECK_SUITE_ID: ${{ github.event.check_suite.id }}
      CHECK_SUITE_HEAD_SHA: ${{ github.event.check_suite.head_sha }}
      CHECK_SUITE_CONCLUSION: ${{ github.event.check_suite.conclusion }}
      REPO: ${{ github.repository }}
    steps:
      - name: Connect to Tailscale
        # macf-actions#49: the VM-local self-hosted runner is already on the
        # tailnet via the host's tailscaled, so a hosted-runner join is
        # unnecessary there — skip this + the readiness poll below. The route
        # step's SSH then reaches the agent over the host's existing tailscaled
        # (the AC-blessed lower-diff path; no separate no-SSH inject branch).
        if: runner.environment != 'self-hosted'
        # macf-actions#42: pinned to v4.1.2 (newest) by commit SHA per the
        # no-floating-tags directive. v4 adds native binary caching (use-cache,
        # default true → the "cache the Tailscale binary" AC, cleaner than an
        # actions/cache hack) + `tailscale up` retry. Inputs verified unchanged
        # from v3 at this SHA (oauth-client-id / oauth-secret / tags).
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
          use-cache: true

      - name: Wait for Tailscale network (poll readiness, fail-loud)
        if: runner.environment != 'self-hosted'  # macf-actions#49: skip on the VM runner (already on the tailnet)
        run: |
          set -euo pipefail
          # macf-actions#42: replace the blind `sleep 10` with a result-invariant
          # readiness poll (Pattern A, silent-fallback-hazards.md). Assert the local
          # tailnet backend is Running AND this node is Online before any tailnet op;
          # FAIL LOUD on timeout instead of proceeding into a cryptic curl/ssh failure
          # (Instance-9 defense, #48). Same assert shape as macf's route-reconciler.yml
          # "Verify tailnet is up". Typically ready in ~1-2s vs the old fixed 10s.
          for i in $(seq 1 30); do
            json=$(tailscale status --json 2>/dev/null || echo '{}')
            state=$(printf '%s' "$json" | jq -r '.BackendState // "Unknown"')
            online=$(printf '%s' "$json" | jq -r '.Self.Online // false')
            if [ "$state" = "Running" ] && [ "$online" = "true" ]; then
              echo "Tailscale ready after ${i}s (BackendState=Running, Self.Online=true)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Tailscale not ready after 30s (BackendState=${state}, Self.Online=${online}). The tailnet never came up — routing would fail. Check TS_OAUTH_* secrets + the tag:ci-runner ACL." >&2
              exit 1
            fi
            sleep 1
          done

      - name: Route CI completion to agent-authored PRs
        run: |
          set -euo pipefail

          # Only act on terminal conclusions. Skip neutral/cancelled/
          # skipped — rarely need agent action and would add noise.
          case "$CHECK_SUITE_CONCLUSION" in
            success|failure|timed_out|action_required)
              ;;
            *)
              echo "Conclusion '$CHECK_SUITE_CONCLUSION' is not actionable, skipping"
              exit 0
              ;;
          esac

          # Enumerate PRs associated with this check_suite. The
          # check_suite event payload has `pull_requests[]` with basic
          # info but not `draft` / `state`, so we query the PR directly.
          PR_NUMBERS=$(gh api \
            "/repos/${REPO}/commits/${CHECK_SUITE_HEAD_SHA}/pulls" \
            --jq '.[] | .number')

          if [ -z "$PR_NUMBERS" ]; then
            echo "No PR associated with SHA ${CHECK_SUITE_HEAD_SHA}, skipping"
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$AGENT_SSH_KEY" > ~/.ssh/id_agent
          chmod 600 ~/.ssh/id_agent

          for PR_NUMBER in $PR_NUMBERS; do
            PR_JSON=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}")
            PR_STATE=$(echo "$PR_JSON" | jq -r '.state')
            PR_DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
            PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login')
            PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')

            # Staleness guard: a force-push during CI produces a
            # workflow_run/check_suite on the OLD head_sha. If that
            # completes after a new one starts, the notification would
            # be misleading — skip it.
            if [ "$PR_HEAD_SHA" != "$CHECK_SUITE_HEAD_SHA" ]; then
              echo "PR #${PR_NUMBER} HEAD moved past ${CHECK_SUITE_HEAD_SHA} (now ${PR_HEAD_SHA}), skipping"
              continue
            fi

            if [ "$PR_STATE" != "open" ]; then
              echo "PR #${PR_NUMBER} state=${PR_STATE}, skipping"
              continue
            fi

            if [ "$PR_DRAFT" = "true" ]; then
              echo "PR #${PR_NUMBER} is a draft, skipping"
              continue
            fi

            # Author-to-agent lookup: PR's author.login must match one
            # of the configured agent app_names (suffix `[bot]`).
            AGENT_NAME=""
            for CANDIDATE in $(echo "$AGENTS" | jq -r 'keys[]'); do
              APP_NAME=$(echo "$AGENTS" | jq -r --arg a "$CANDIDATE" '.[$a].app_name // empty')
              if [ "$PR_AUTHOR" = "${APP_NAME}[bot]" ]; then
                AGENT_NAME="$CANDIDATE"
                break
              fi
            done

            if [ -z "$AGENT_NAME" ]; then
              echo "PR #${PR_NUMBER} author '${PR_AUTHOR}' is not a registered agent, skipping"
              continue
            fi

            # Build the notification prompt.
            PR_URL="https://github.com/${REPO}/pull/${PR_NUMBER}"
            if [ "$CHECK_SUITE_CONCLUSION" = "success" ]; then
              PROMPT="PR #${PR_NUMBER} (\"${PR_TITLE}\"): CI SUCCESS. ${PR_URL}. Next: merge if you're the author."
            else
              # On failure, name the first failing check for faster
              # triage. `gh api` returns check_runs for this suite;
              # filter to failed ones.
              FAILING=$(gh api \
                "/repos/${REPO}/check-suites/${CHECK_SUITE_ID}/check-runs" \
                --jq '.check_runs[] | select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="action_required") | .name' \
                | head -1)
              if [ -n "$FAILING" ]; then
                PROMPT="PR #${PR_NUMBER} (\"${PR_TITLE}\"): CI FAILED. First failing check: '${FAILING}'. ${PR_URL}. Next: investigate + push fix."
              else
                PROMPT="PR #${PR_NUMBER} (\"${PR_TITLE}\"): CI FAILED (${CHECK_SUITE_CONCLUSION}). ${PR_URL}. Next: investigate + push fix."
              fi
            fi

            HOST=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].host')
            SESSION=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].tmux_session')
            WINDOW=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].tmux_window // empty')
            SSH_USER=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].ssh_user')
            TMUX_BIN=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].tmux_bin // "tmux"')
            WORKSPACE_DIR=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].workspace_dir // empty')

            if [ -n "$WINDOW" ]; then
              TARGET="${SESSION}:${WINDOW}"
            else
              TARGET="$SESSION"
            fi

            # macf-actions#47: PR_TITLE is attacker-controllable on a public repo.
            # Append the route-correlation marker (macf#444 Option D), then send
            # the whole prompt as opaque base64 DATA — decoded into a quoted remote
            # var, NEVER interpolated. Replaces the prior `tr -d "'"` strip, which
            # only closed the single-quote breakout (backticks/$()/newlines were
            # left to the remote single-quoting); base64 needs no such reasoning.
            PROMPT="${PROMPT} [macf-route:${ROUTE_RUN_ID}:${AGENT_NAME}]"
            PROMPT_B64=$(printf '%s' "$PROMPT" | base64 | tr -d '\n')

            # Probe liveness with retry (groundnuty/macf#437 cause 2): alive /
            # absent / unknown; only genuine absent skips, unknown still attempts
            # (a dropped CI-completion ping strands an agent-authored PR).
            SESSION_STATE=unknown
            for probe_attempt in 1 2 3; do
              # `|| true`: an ssh transport failure (exit 255, empty stdout) must
              # NOT abort the step under `set -euo pipefail` — leave PROBE empty so
              # it falls to the retry arm (groundnuty/macf#437 PR #44 review).
              PROBE=$(ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
                -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
                "${TMUX_BIN} has-session -t ${SESSION} >/dev/null 2>&1; echo rc=\$?" 2>/dev/null) || true
              # rc=0 alive; rc=1 genuine no-session (absent); anything else
              # (empty=ssh-fail, rc=127=tmux-missing) → unknown → retry → attempt.
              case "$PROBE" in
                rc=0) SESSION_STATE=alive; break ;;
                rc=1) SESSION_STATE=absent; break ;;
                *)    if [ "$probe_attempt" -lt 3 ]; then sleep 3; fi ;;
              esac
            done

            if [ "$SESSION_STATE" = "absent" ]; then
              echo "Agent ${AGENT_NAME} session not found (offline), skipping CI-completion for PR #${PR_NUMBER}"
            else
              HELPER="${WORKSPACE_DIR}/.claude/scripts/tmux-send-to-claude.sh"
              HELPER_OK=no
              if [ -n "$WORKSPACE_DIR" ] && ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
                -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" "test -x '${HELPER}'" 2>/dev/null; then
                HELPER_OK=yes
              fi
              if [ "$HELPER_OK" = "yes" ] && ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
                -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
                "PROMPT=\$(printf %s '${PROMPT_B64}' | base64 -d) && '${HELPER}' '${TARGET}' \"\$PROMPT\""; then
                echo "Routed CI completion for PR #${PR_NUMBER} to ${AGENT_NAME} via helper (target=${TARGET}, session=${SESSION_STATE})"
              elif ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
                -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
                "PROMPT=\$(printf %s '${PROMPT_B64}' | base64 -d) \
                  && ${TMUX_BIN} send-keys -t ${TARGET} C-u \
                  && ${TMUX_BIN} send-keys -t ${TARGET} \"\$PROMPT\" Enter \
                  && sleep 1 \
                  && ${TMUX_BIN} send-keys -t ${TARGET} Enter"; then
                echo "Routed CI completion for PR #${PR_NUMBER} to ${AGENT_NAME} via inline (target=${TARGET}, session=${SESSION_STATE})"
              else
                echo "Agent ${AGENT_NAME} delivery FAILED for PR #${PR_NUMBER} after probe=${SESSION_STATE} (attempted, not silently offline-skipped)"
              fi
            fi
          done

  # ─── ROUTE PR REVIEW STATE TO THE PR AUTHOR (macf#432 backport) ───
  # An approve / changes-requested review notifies the PR author
  # (implementer) in their tmux session, so a `gh pr review` reaches the
  # author without a manual @mention. Backported to v1.3.2 from the v3.3.0
  # `route-by-pr-review-state` feature, but REIMPLEMENTED on the v1.x
  # SSH/tmux primitive (the same one route-by-ci-completion + route-by-
  # mention use) — NOT the v3 mTLS path. The v1.x contract is preserved:
  # same 3 secrets, no new inputs. Everything is read from the
  # pull_request_review event payload (PR + review objects) — no `gh api`
  # calls, so no caller `permissions:` beyond the v1.3.1 set is needed.
  route-by-pr-review-state:
    needs: config
    if: >
      (github.event_name == 'pull_request_review') &&
      (github.event.review.state == 'approved' ||
       github.event.review.state == 'changes_requested')
    runs-on: ${{ vars.MACF_ROUTING_RUNS_ON && fromJSON(vars.MACF_ROUTING_RUNS_ON) || 'ubuntu-latest' }}
    env:
      AGENT_SSH_KEY: ${{ secrets.AGENT_SSH_KEY }}
      # macf#444 Option D: route-run id for the turn-ack correlation marker.
      ROUTE_RUN_ID: ${{ github.run_id }}
      AGENTS: ${{ needs.config.outputs.agents }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_DRAFT: ${{ github.event.pull_request.draft }}
      REVIEW_STATE: ${{ github.event.review.state }}
      REVIEWER: ${{ github.event.review.user.login }}
      REVIEW_URL: ${{ github.event.review.html_url }}
    steps:
      - name: Connect to Tailscale
        # macf-actions#49: the VM-local self-hosted runner is already on the
        # tailnet via the host's tailscaled, so a hosted-runner join is
        # unnecessary there — skip this + the readiness poll below. The route
        # step's SSH then reaches the agent over the host's existing tailscaled
        # (the AC-blessed lower-diff path; no separate no-SSH inject branch).
        if: runner.environment != 'self-hosted'
        # macf-actions#42: pinned to v4.1.2 (newest) by commit SHA per the
        # no-floating-tags directive. v4 adds native binary caching (use-cache,
        # default true → the "cache the Tailscale binary" AC, cleaner than an
        # actions/cache hack) + `tailscale up` retry. Inputs verified unchanged
        # from v3 at this SHA (oauth-client-id / oauth-secret / tags).
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
          use-cache: true

      - name: Wait for Tailscale network (poll readiness, fail-loud)
        if: runner.environment != 'self-hosted'  # macf-actions#49: skip on the VM runner (already on the tailnet)
        run: |
          set -euo pipefail
          # macf-actions#42: replace the blind `sleep 10` with a result-invariant
          # readiness poll (Pattern A, silent-fallback-hazards.md). Assert the local
          # tailnet backend is Running AND this node is Online before any tailnet op;
          # FAIL LOUD on timeout instead of proceeding into a cryptic curl/ssh failure
          # (Instance-9 defense, #48). Same assert shape as macf's route-reconciler.yml
          # "Verify tailnet is up". Typically ready in ~1-2s vs the old fixed 10s.
          for i in $(seq 1 30); do
            json=$(tailscale status --json 2>/dev/null || echo '{}')
            state=$(printf '%s' "$json" | jq -r '.BackendState // "Unknown"')
            online=$(printf '%s' "$json" | jq -r '.Self.Online // false')
            if [ "$state" = "Running" ] && [ "$online" = "true" ]; then
              echo "Tailscale ready after ${i}s (BackendState=Running, Self.Online=true)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Tailscale not ready after 30s (BackendState=${state}, Self.Online=${online}). The tailnet never came up — routing would fail. Check TS_OAUTH_* secrets + the tag:ci-runner ACL." >&2
              exit 1
            fi
            sleep 1
          done

      - name: Route PR review state to the PR author
        run: |
          set -euo pipefail

          # A review can land on a draft or non-open PR; skip both (no
          # actionable next step for the author).
          if [ "$PR_STATE" != "open" ]; then
            echo "PR #${PR_NUMBER} state=${PR_STATE}, skipping"
            exit 0
          fi
          if [ "$PR_DRAFT" = "true" ]; then
            echo "PR #${PR_NUMBER} is a draft, skipping"
            exit 0
          fi

          # Author-to-agent lookup: the PR author (implementer) must be a
          # registered agent. Human / dependabot-authored PRs no-op cleanly
          # (no channel-server to notify) — same guard as route-by-ci-completion.
          AGENT_NAME=""
          for CANDIDATE in $(echo "$AGENTS" | jq -r 'keys[]'); do
            APP_NAME=$(echo "$AGENTS" | jq -r --arg a "$CANDIDATE" '.[$a].app_name // empty')
            if [ "$PR_AUTHOR" = "${APP_NAME}[bot]" ]; then
              AGENT_NAME="$CANDIDATE"
              break
            fi
          done

          if [ -z "$AGENT_NAME" ]; then
            echo "PR #${PR_NUMBER} author '${PR_AUTHOR}' is not a registered agent, skipping"
            exit 0
          fi

          # Build the notification prompt per review state. Both approved
          # and changes_requested route — the author needs the changes-
          # requested ping as much as the approve.
          PR_URL="https://github.com/${REPO}/pull/${PR_NUMBER}"
          if [ "$REVIEW_STATE" = "approved" ]; then
            PROMPT="PR #${PR_NUMBER} (\"${PR_TITLE}\"): review APPROVED by ${REVIEWER}. ${REVIEW_URL}. Next: merge if you are the author (after the LGTM gate is satisfied)."
          else
            PROMPT="PR #${PR_NUMBER} (\"${PR_TITLE}\"): CHANGES REQUESTED by ${REVIEWER}. ${REVIEW_URL}. Next: address the feedback + push to the same branch."
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$AGENT_SSH_KEY" > ~/.ssh/id_agent
          chmod 600 ~/.ssh/id_agent

          HOST=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].host')
          SESSION=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].tmux_session')
          WINDOW=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].tmux_window // empty')
          SSH_USER=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].ssh_user')
          TMUX_BIN=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].tmux_bin // "tmux"')
          WORKSPACE_DIR=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].workspace_dir // empty')

          if [ -n "$WINDOW" ]; then
            TARGET="${SESSION}:${WINDOW}"
          else
            TARGET="$SESSION"
          fi

          # macf-actions#47: PR_TITLE is attacker-controllable on a public repo.
          # Append the marker (macf#444 Option D), then send as opaque base64 DATA
          # — decoded into a quoted remote var, never interpolated (replaces the
          # prior `tr -d "'"` strip; same hardening as route-by-ci-completion).
          PROMPT="${PROMPT} [macf-route:${ROUTE_RUN_ID}:${AGENT_NAME}]"
          PROMPT_B64=$(printf '%s' "$PROMPT" | base64 | tr -d '\n')

          # Probe liveness with retry (groundnuty/macf#437 cause 2): alive /
          # absent / unknown; only genuine absent skips, unknown still attempts
          # (a dropped approve/changes-requested ping strands the PR author).
          SESSION_STATE=unknown
          for probe_attempt in 1 2 3; do
            # `|| true`: an ssh transport failure (exit 255, empty stdout) must NOT
            # abort the step under `set -euo pipefail` — leave PROBE empty so it
            # falls to the retry arm (groundnuty/macf#437 PR #44 review blocker).
            PROBE=$(ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
              "${TMUX_BIN} has-session -t ${SESSION} >/dev/null 2>&1; echo rc=\$?" 2>/dev/null) || true
            # rc=0 alive; rc=1 genuine no-session (absent); anything else (empty=
            # ssh-fail, rc=127=tmux-missing) → unknown → retry → attempt.
            case "$PROBE" in
              rc=0) SESSION_STATE=alive; break ;;
              rc=1) SESSION_STATE=absent; break ;;
              *)    if [ "$probe_attempt" -lt 3 ]; then sleep 3; fi ;;
            esac
          done

          if [ "$SESSION_STATE" = "absent" ]; then
            echo "Agent ${AGENT_NAME} session not found (offline), skipping review-state for PR #${PR_NUMBER}"
          else
            HELPER="${WORKSPACE_DIR}/.claude/scripts/tmux-send-to-claude.sh"
            HELPER_OK=no
            if [ -n "$WORKSPACE_DIR" ] && ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" "test -x '${HELPER}'" 2>/dev/null; then
              HELPER_OK=yes
            fi
            if [ "$HELPER_OK" = "yes" ] && ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
              "PROMPT=\$(printf %s '${PROMPT_B64}' | base64 -d) && '${HELPER}' '${TARGET}' \"\$PROMPT\""; then
              echo "Routed review-state (${REVIEW_STATE}) for PR #${PR_NUMBER} to ${AGENT_NAME} via helper (target=${TARGET}, session=${SESSION_STATE})"
            elif ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_agent "${SSH_USER}@${HOST}" \
              "PROMPT=\$(printf %s '${PROMPT_B64}' | base64 -d) \
                && ${TMUX_BIN} send-keys -t ${TARGET} C-u \
                && ${TMUX_BIN} send-keys -t ${TARGET} \"\$PROMPT\" Enter \
                && sleep 1 \
                && ${TMUX_BIN} send-keys -t ${TARGET} Enter"; then
              echo "Routed review-state (${REVIEW_STATE}) for PR #${PR_NUMBER} to ${AGENT_NAME} via inline (target=${TARGET}, session=${SESSION_STATE})"
            else
              echo "Agent ${AGENT_NAME} delivery FAILED for PR #${PR_NUMBER} review after probe=${SESSION_STATE} (attempted, not silently offline-skipped)"
            fi
          fi

  # ─── LABEL CLEANUP ON CLOSE ───
  cleanup-labels:
    if: >
      (github.event_name == 'issues') &&
      (github.event.action == 'closed')
    runs-on: ${{ vars.MACF_ROUTING_RUNS_ON && fromJSON(vars.MACF_ROUTING_RUNS_ON) || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Remove status labels
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          for LABEL in in-progress in-review blocked; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" 2>/dev/null || true
          done
          echo "Cleaned status labels from issue #${ISSUE_NUMBER}"
