name: Agent Router (reusable, v3 — registry-driven mTLS transport)

# Reusable workflow for routing GitHub events (issues, comments, PRs,
# check_suites) to MACF agents. v3 resolves each agent's host + port
# from the MACF registry (GitHub Variables per DR-005/DR-006/DR-007)
# instead of reading them from the caller's agent-config.json. This
# closes the v2.0.1 DR-007 violation (see macf-actions#18) and restores
# the dynamic-port-assignment property that lets multiple agents share
# a VM without operator-managed port coordination.
#
# v3 is a breaking change vs v2.0.1. See CHANGELOG §3.0.0 for the
# consumer migration steps (new secrets, new inputs, agent-config.json
# schema slim-down).
#
# Caller requirements:
#   inputs:
#     project               — project name used to derive registry variable
#                             names (e.g. `academic-resume` →
#                             `ACADEMIC_RESUME_AGENT_<NAME>` and
#                             `ACADEMIC_RESUME_CA_CERT`). Required.
#     registry-api-path     — API path prefix for the registry scope
#                             (omit trailing /actions/variables). Covers
#                             all three DR-006 scopes: org, profile, repo.
#                             Optional; defaults to `/orgs/<caller-owner>`.
#     runner-runs-on         — (macf-actions#81) mirrors the fleet manifest's
#                             `routing.runner.runs_on` verbatim. When exactly
#                             "self-hosted", `pick-runner` REFUSES to fall
#                             back to a metered github-hosted runner for a
#                             non-fork event whose actor isn't trusted — it
#                             fails the job instead (naming the actor, the
#                             MACF_TRUSTED_ACTORS variable, and the repo) so
#                             a declared-self-hosted fleet can never silently
#                             bill on ubuntu-latest. Optional; omitted/empty/
#                             any other value leaves `pick-runner` exactly as
#                             it behaved before #81 — including a fork PR,
#                             which still downgrades to hosted without
#                             failing regardless of this input (an untrusted
#                             fork must never reach the self-hosted runner).
#   secrets (groundnuty/macf-actions#1169 — either form works; bundle
#   preferred, six-secret form kept for backward compatibility):
#     MACF_ROUTING_BUNDLE   — PREFERRED. base64(JSON) of the six values
#                             below, keyed by their own secret names
#                             (groundnuty/macf#1112/#1118,
#                             apply-routing-secrets.ts::packRoutingBundle).
#                             A bundle-supplying caller needs no other
#                             routing secret and never has to regenerate
#                             when this workflow's secret set changes.
#                             Every route-by-* job's first step unpacks it
#                             (or falls back to the six below if absent) —
#                             see "Resolve routing secrets" in each job.
#     ROUTING_CLIENT_CERT   — base64 PEM, minted via `macf certs issue-routing-client`
#     ROUTING_CLIENT_KEY    — base64 PEM, ditto
#     TS_OAUTH_CLIENT_ID    — Tailscale OAuth client ID (runner → agent VM)
#     TS_OAUTH_SECRET       — Tailscale OAuth secret
#     MACF_ROUTING_APP_ID   — GitHub App ID for a variables:read-only App
#                             installed on the registry org (see §3.0.0
#                             migration for dedicated-App rationale).
#     MACF_ROUTING_APP_KEY  — PEM private key for the above App.
#     All six above are declared `required: false` at the workflow_call
#     level so a bundle-only caller's `secrets:` block doesn't have to
#     enumerate them — but a caller supplying NEITHER the bundle NOR a
#     complete six fails loudly at job start (named per missing secret),
#     never a partial run on empty values. A caller supplying a BUNDLE
#     that is present-but-malformed (bad base64, bad JSON, or missing a
#     key) also fails loudly — it never silently falls back to the six
#     even if those happen to be present too, so a bundle-packing bug
#     can't hide behind a coincidental fallback.
#   registry (same source + registry-read token as host/port; primary as
#   of #66):
#     <PROJECT_SEG>_CA_CERT — public PEM of the project CA, resolved from
#                             the MACF registry (DR-005/DR-006/DR-007) via
#                             the same registry-read token minted for the
#                             host/port lookup. Name is derived from
#                             `inputs.project` via toVariableSegment
#                             (uppercase + hyphen→underscore). Set by
#                             `macf certs init` at Phase 3 of the deployment.
#   vars (on the caller repo, org, or enclosing scope) — TRANSITIONAL
#   fallback only, consulted when the registry lookup misses:
#     <PROJECT_SEG>_CA_CERT — same name/shape, as a per-repo GitHub Actions
#                             variable. Pre-#66 primary source; every
#                             bootstrapped repo was missing this (macf
#                             certs init writes to the registry, not the
#                             repo), which was the root cause of the
#                             groundnuty/macf#799/#806 outage class. Kept
#                             only so repos mid-migration keep routing;
#                             set the value in the registry instead.
#   caller's agent-config.json:
#     Each agent entry needs `app_name` (used for actor-comparison skip).
#     Legacy fields carried over from v1.x / v2.x consumers (`host`,
#     `port`, `tmux_session`, `tmux_bin`, `ssh_user`, `ssh_key_secret`)
#     may remain in the file but are unread under v3 — the registry is
#     the single source of truth for addressing.

on:
  workflow_call:
    inputs:
      project:
        description: >-
          Project name used to derive registry variable names. Must match
          the `project` field in the agent's `.macf/macf-agent.json`.
        type: string
        required: true
      registry-api-path:
        description: >-
          GitHub REST API path prefix for the MACF registry, without trailing
          `/actions/variables`. Examples per DR-006: `/orgs/<org>` for org
          scope, `/repos/<user>/<user>` for profile scope, `/repos/<o>/<r>`
          for repo scope.
        type: string
        required: false
        default: /orgs/${{ github.repository_owner }}
      runner-runs-on:
        description: >-
          Optional (groundnuty/macf-actions#81). Mirrors the fleet
          manifest's `routing.runner.runs_on` verbatim. When exactly
          "self-hosted", `pick-runner` fails the job — naming the actor,
          MACF_TRUSTED_ACTORS, and the repo — instead of silently
          relocating to a metered github-hosted runner for a non-fork
          event whose actor isn't trusted. Omitted, empty, or any other
          value (e.g. "hosted") leaves `pick-runner`'s behaviour exactly
          as it was before #81. A fork PR always keeps downgrading to
          hosted without failing, regardless of this input.
        type: string
        required: false
        default: ''
    secrets:
      # groundnuty/macf-actions#1169: all seven below are `required: false`
      # at the workflow_call level so BOTH forms are structurally optional
      # (a bundle-only caller's `secrets:` block need not enumerate the six;
      # a legacy caller need not add the bundle). This does NOT mean a run
      # can proceed with nothing:
      #   - groundnuty/macf-actions#82: `pick-runner` (the FIRST job) has
      #     its own "Assert one complete routing-secrets form before any
      #     work" step, which fails the job loudly — before `config` or any
      #     route-by-* job does any work — naming BOTH valid forms, exactly
      #     which of the six is missing, and (on the "neither form"
      #     failure) the likely cross-org `secrets: inherit` cause
      #     (groundnuty/macf#1338). A `pick-runner` failure fails/skips
      #     every downstream job via the existing `needs:` chain. This
      #     check DELIBERATELY EXCLUDES `issues.labeled` events (see that
      #     step's own comment) — including them would reintroduce the
      #     exact regression #1169 relocated route-by-label's own gate to
      #     prevent (a hard failure on every non-agent-labeled issue for a
      #     caller that never configured routing secrets at all).
      #   - Each route-by-* job ALSO still has its own first-step
      #     "Resolve routing secrets" check (pre-existing, #1169) — this is
      #     what actually POPULATES the resolved values for that job's use
      #     (mint the App token, mTLS POST, etc). For route-by-mention,
      #     route-by-ci-completion, and route-by-pr-review-state, the
      #     pick-runner assertion above already validated the same
      #     invariant from the same inputs, so this per-job check should
      #     never newly fail in practice — it remains as the
      #     value-resolution mechanism and as defense-in-depth. For
      #     route-by-label specifically, pick-runner's assertion does NOT
      #     cover `issues.labeled` (above) — this per-job check is its
      #     ONLY enforcement point and stays fully load-bearing.
      # In both places, EXCEPT TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET, which
      # the fallback path only requires when this run will actually
      # attempt a Tailscale connect (TAILNET_NEEDED — see each check's own
      # step doc). A fleet routing exclusively via the self-hosted
      # `macf-vm` runner (already tailnet-joined, #64) never consumes
      # those two, and requiring them anyway would have broken every such
      # fleet's routing on upgrade. Declaring `required: true` here would
      # only catch "caller's secrets: block omits the name entirely" (a
      # YAML authoring mistake) — it can't express "either this OR those
      # six, together" (nor the Tailscale carve-out), so that invariant is
      # enforced in shell instead, at the places that inspect both
      # sources.
      MACF_ROUTING_BUNDLE:
        description: >-
          Preferred. base64(JSON) of the six routing secrets below, keyed
          by their own names (groundnuty/macf#1112/#1118). A caller
          supplying this needs no other routing secret and never has to
          regenerate its caller workflow when this reusable's secret set
          changes.
        required: false
      ROUTING_CLIENT_CERT:
        description: >-
          Base64 PEM of the routing-action client certificate. Legacy
          form — used when MACF_ROUTING_BUNDLE is not supplied.
        required: false
      ROUTING_CLIENT_KEY:
        description: >-
          Base64 PEM of the routing-action client private key. Legacy
          form — used when MACF_ROUTING_BUNDLE is not supplied.
        required: false
      TS_OAUTH_CLIENT_ID:
        description: >-
          Tailscale OAuth client ID for the GHA runner. Legacy form —
          used when MACF_ROUTING_BUNDLE is not supplied.
        required: false
      TS_OAUTH_SECRET:
        description: >-
          Tailscale OAuth secret for the GHA runner. Legacy form — used
          when MACF_ROUTING_BUNDLE is not supplied.
        required: false
      MACF_ROUTING_APP_ID:
        description: >-
          GitHub App ID for the variables:read-only App that mints
          registry access tokens (dedicated App keeps blast radius
          small). Legacy form — used when MACF_ROUTING_BUNDLE is not
          supplied.
        required: false
      MACF_ROUTING_APP_KEY:
        description: >-
          PEM private key for the MACF_ROUTING App. Legacy form — used
          when MACF_ROUTING_BUNDLE is not supplied.
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

jobs:

  # ─── RUNNER SELECTION (origin-routing — #59 / devops-toolkit#90) ───
  # Trusted actor on a NON-fork event → self-hosted VM runner (fast path,
  # ~6-9s vs ~40s); everyone else (outsiders / fork PRs) → github-hosted.
  # FAILS SAFE: unset/empty MACF_TRUSTED_ACTORS (the CALLER repo's var) →
  # ubuntu-latest (today's behaviour) UNLESS the caller declared
  # runner-runs-on: self-hosted (#81 below), in which case that same
  # untrusted-actor condition fails the job instead. So this lands BEFORE
  # any runner exists; the self-hosted branch activates only once the var
  # is set AND a runner is registered (register-before-route sequencing —
  # devops RUNNER.md). Trust is decided from github.actor + head.repo.fork,
  # both GitHub-set (not spoofable). Every downstream job derives runs-on
  # from this job's output.
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - id: pick
        shell: bash
        env:
          TRUSTED_ACTORS: ${{ vars.MACF_TRUSTED_ACTORS }}
          ACTOR: ${{ github.actor }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          RUNNER_RUNS_ON: ${{ inputs.runner-runs-on }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set -f  # disable globbing — actor logins contain [bot]
          labels='"ubuntu-latest"'   # default: github-hosted (safe fallback)
          trusted=false
          # Self-host ONLY for a trusted actor on a non-fork event. Logins in
          # MACF_TRUSTED_ACTORS are comma / space / newline separated.
          if [ "${IS_FORK:-}" != "true" ] && [ -n "${TRUSTED_ACTORS:-}" ]; then
            for a in ${TRUSTED_ACTORS//,/ }; do
              if [ "$a" = "$ACTOR" ]; then
                labels='["self-hosted","macf-vm"]'
                trusted=true
                break
              fi
            done
          fi
          # macf-actions#81 — a caller that DECLARES runner-runs-on:
          # self-hosted must never silently relocate real work onto a
          # metered ubuntu-latest runner ("it should be impossible and
          # forbidden to fall back", per the operator's directive on #81).
          # The fork carve-out above is deliberately untouched: an
          # untrusted fork PR still downgrades instead of failing, because
          # self-hosted access for an unreviewed fork is exactly what that
          # downgrade exists to prevent regardless of what the caller
          # declared. Only a non-fork event whose actor failed the trust
          # check is a silent-billing risk — that's the one case this
          # turns into a red job. An unset/empty MACF_TRUSTED_ACTORS
          # (declaration effectively unreadable) falls into the same
          # untrusted branch above, so it fails closed here too — it is
          # never inferred as "hosted is fine".
          if [ "${RUNNER_RUNS_ON:-}" = "self-hosted" ] && [ "$trusted" != "true" ] && [ "${IS_FORK:-}" != "true" ]; then
            echo "::error::runner-runs-on=self-hosted was declared for ${REPO:-this repo}, but actor '${ACTOR:-<unknown>}' is not listed in the MACF_TRUSTED_ACTORS variable (repo or org scope) that pick-runner reads to decide self-hosted eligibility — refusing to fall back to a metered ubuntu-latest runner. Fix: add '${ACTOR:-<actor>}' to MACF_TRUSTED_ACTORS on ${REPO:-the caller repo} (or its org), then re-run."
            exit 1
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "runner: actor='$ACTOR' fork='${IS_FORK:-false}' runner-runs-on='${RUNNER_RUNS_ON:-<none>}' -> $labels"

      # groundnuty/macf-actions#82: EARLIEST-JOB precondition check. The
      # per-job "Resolve routing secrets" step (in each of the four
      # route-by-* jobs below) already fails loud on an incomplete
      # config — but only for the ONE job whose OWN event matched, and
      # only after `config` has already run. This step asserts the same
      # invariant — exactly ONE complete form (A: all six individual
      # secrets, or B: MACF_ROUTING_BUNDLE) — here instead, in the FIRST
      # job of the workflow, before `config` or any route-by-* job does
      # any work. A `run:` step failure fails this job, which fails/skips
      # every downstream job via the existing `needs:` chain (`config:
      # needs: pick-runner`; every route-by-*: `needs: [config, ...]`) —
      # no new `needs:` edges required anywhere else in this file.
      #
      # `if:` mirrors the union of THREE of the four route-by-* jobs' own
      # top-level event/action gates below (route-by-mention,
      # route-by-ci-completion, route-by-pr-review-state — the last is a
      # strict subset of route-by-mention's `pull_request_review`
      # condition, already covered) — deliberately coarser than their own
      # finer internal filters, same reasoning as below.
      #
      # `issues.labeled` is DELIBERATELY EXCLUDED from this union, even
      # though route-by-label also consumes these secrets. Including it
      # would reintroduce the exact regression #1169 relocated
      # route-by-label's own "Label gate" step to prevent: "Resolving
      # secrets FIRST (unconditionally...) would turn every irrelevant-
      # label event into a hard job failure whenever this repo's routing
      # secrets happen to be incomplete — a regression #1169 must not
      # introduce" (see that step's own comment + CHANGELOG [Unreleased],
      # "route-by-label reordered"). Unlike the other three jobs, telling
      # "this event could plausibly route" from "this event definitely
      # won't" for a labeled issue needs `agent-config.json`'s app_name
      # map (is `bug` an agent label or not?) — data `config` reads, not
      # `pick-runner`. So route-by-label's own gate-then-resolve ordering
      # remains the ONLY enforcement point for label-routing callers; its
      # per-job "Resolve routing secrets" check (with the same cross-org
      # hint, #82 commit 1) is genuinely load-bearing, not merely
      # defense-in-depth — see that job's own comment.
      #
      # KEEP IN LOCKSTEP with the three jobs' own `if:` blocks below if
      # their trigger surface changes — same manual-lockstep convention
      # this repo already applies to test/routing-bundle-unpack.sh (see
      # that file's header comment).
      - name: Assert one complete routing-secrets form before any work (#82)
        id: validate-routing-secrets
        if: >
          (
            (github.event_name == 'issue_comment') ||
            (github.event_name == 'pull_request') ||
            (github.event_name == 'pull_request_review') ||
            (github.event_name == 'check_suite' && github.event.action == 'completed')
          )
        env:
          BUNDLE: ${{ secrets.MACF_ROUTING_BUNDLE }}
          IN_MACF_ROUTING_APP_ID: ${{ secrets.MACF_ROUTING_APP_ID }}
          IN_MACF_ROUTING_APP_KEY: ${{ secrets.MACF_ROUTING_APP_KEY }}
          IN_ROUTING_CLIENT_CERT: ${{ secrets.ROUTING_CLIENT_CERT }}
          IN_ROUTING_CLIENT_KEY: ${{ secrets.ROUTING_CLIENT_KEY }}
          IN_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          IN_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          # Same carve-out as every route-by-* job's own resolution step:
          # a fleet routing exclusively via the self-hosted `macf-vm`
          # runner (already tailnet-joined, #64) never needs TS_OAUTH_*.
          # `steps.pick.outputs.labels` (this job's OWN prior step, not
          # `needs.pick-runner...` — we ARE pick-runner) is the same
          # value every downstream job reads.
          TAILNET_NEEDED: ${{ !contains(steps.pick.outputs.labels, 'self-hosted') }}
        run: |
          set -euo pipefail

          # Validate-only: unlike each route-by-* job's own resolution
          # step, this step never needs the values downstream (pick-runner
          # has no route to make) — it only asserts completeness and
          # exits. Masking guards against an accidental future debug
          # echo, not against any write this step currently performs.
          mask_lines() {
            local value="$1" line
            while IFS= read -r line || [ -n "$line" ]; do
              [ -n "$line" ] && echo "::add-mask::${line}"
            done <<< "$value"
          }

          NAMES="MACF_ROUTING_APP_ID MACF_ROUTING_APP_KEY ROUTING_CLIENT_CERT ROUTING_CLIENT_KEY TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET"
          CROSS_ORG_HINT="Likely cause if you're a cross-org/enterprise caller: 'secrets: inherit' only propagates within the SAME organization/enterprise (GitHub docs) — see groundnuty/macf#1338, where a cross-org caller had all six secrets on its OWN repo but none reached this call. Pass the routing secrets explicitly in your caller workflow's 'secrets:' block, or supply MACF_ROUTING_BUNDLE."

          if [ -n "${BUNDLE:-}" ]; then
            mask_lines "$BUNDLE"
            echo "routing secrets preflight: MACF_ROUTING_BUNDLE supplied — validating form B (bundle)"
            if ! DECODED=$(printf '%s' "$BUNDLE" | base64 -d 2>/dev/null); then
              echo "::error::MACF_ROUTING_BUNDLE is not valid base64 — refusing to route on an unreadable bundle."
              exit 1
            fi
            mask_lines "$DECODED"
            if ! printf '%s' "$DECODED" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::MACF_ROUTING_BUNDLE decoded but is not a JSON object — refusing to route on a malformed bundle."
              exit 1
            fi
            MISSING=""
            for NAME in $NAMES; do
              VALUE=$(printf '%s' "$DECODED" | jq -r --arg k "$NAME" '.[$k] // empty')
              [ -z "$VALUE" ] && MISSING="${MISSING:+$MISSING, }$NAME"
            done
            unset DECODED
            if [ -n "$MISSING" ]; then
              echo "::error::MACF_ROUTING_BUNDLE is missing required key(s): $MISSING — refusing to route on a partial bundle."
              exit 1
            fi
            echo "routing secrets preflight: form B (MACF_ROUTING_BUNDLE) is complete — proceeding"
            exit 0
          fi

          echo "routing secrets preflight: MACF_ROUTING_BUNDLE not supplied — validating form A (six individual secrets)"
          MISSING=""
          for NAME in $NAMES; do
            case "$NAME" in
              MACF_ROUTING_APP_ID)  VALUE="${IN_MACF_ROUTING_APP_ID:-}" ;;
              MACF_ROUTING_APP_KEY) VALUE="${IN_MACF_ROUTING_APP_KEY:-}" ;;
              ROUTING_CLIENT_CERT)  VALUE="${IN_ROUTING_CLIENT_CERT:-}" ;;
              ROUTING_CLIENT_KEY)   VALUE="${IN_ROUTING_CLIENT_KEY:-}" ;;
              TS_OAUTH_CLIENT_ID)   VALUE="${IN_TS_OAUTH_CLIENT_ID:-}" ;;
              TS_OAUTH_SECRET)      VALUE="${IN_TS_OAUTH_SECRET:-}" ;;
            esac
            if [ -n "$VALUE" ]; then
              mask_lines "$VALUE"
              continue
            fi
            if { [ "$NAME" = "TS_OAUTH_CLIENT_ID" ] || [ "$NAME" = "TS_OAUTH_SECRET" ]; } \
              && [ "${TAILNET_NEEDED:-true}" != "true" ]; then
              echo "routing secrets preflight: $NAME not supplied and not needed this run (self-hosted runner skips Tailscale connect) — leaving unset"
              continue
            fi
            MISSING="${MISSING:+$MISSING, }$NAME"
          done

          if [ -n "$MISSING" ]; then
            echo "::error::This caller supplied neither a complete MACF_ROUTING_BUNDLE (form B) nor a complete set of the six individual routing secrets (form A). Missing from form A: $MISSING."
            echo "::error::Exactly ONE complete form is required: (A) all six — MACF_ROUTING_APP_ID, MACF_ROUTING_APP_KEY, ROUTING_CLIENT_CERT, ROUTING_CLIENT_KEY, TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET — or (B) MACF_ROUTING_BUNDLE (preferred, groundnuty/macf#1112)."
            echo "::error::${CROSS_ORG_HINT}"
            exit 1
          fi
          echo "routing secrets preflight: form A (six individual secrets) is complete — proceeding"

  # ─── LOAD CONFIG ───
  config:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    outputs:
      agents: ${{ steps.load.outputs.agents }}
      project-seg: ${{ steps.compute.outputs.project-seg }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/agent-config.json
          sparse-checkout-cone-mode: false

      - name: Load config
        id: load
        run: |
          echo "agents=$(jq -c '.agents' .github/agent-config.json)" >> "$GITHUB_OUTPUT"

      - name: Compute toVariableSegment(project) for downstream vars lookup
        id: compute
        env:
          RAW_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          : "${RAW_PROJECT:?project input must not be empty}"
          seg=$(printf '%s' "$RAW_PROJECT" | tr '[:lower:]-' '[:upper:]_')
          echo "project-seg=${seg}" >> "$GITHUB_OUTPUT"

  # ─── LABEL ROUTING ───
  route-by-label:
    needs: [config, pick-runner]
    if: >
      (github.event_name == 'issues') &&
      (github.event.action == 'labeled') &&
      (github.actor != 'github-actions[bot]')
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    env:
      AGENTS: ${{ needs.config.outputs.agents }}
      # macf-actions#66: TRANSITIONAL fallback only — the per-repo `vars[...]`
      # copy of the CA cert. The registry (see the "Resolve project CA cert"
      # step below) is now the primary source, same as host/port.
      PROJECT_CA_CERT_REPO_VAR_FALLBACK: ${{ vars[format('{0}_CA_CERT', needs.config.outputs.project-seg)] }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_SEG: ${{ needs.config.outputs.project-seg }}
    steps:
      # groundnuty/macf-actions#1169: Label gate runs FIRST, before any
      # secret resolution or Tailscale connect — this job (uniquely among
      # the four route-by-* jobs) has an event class that's a clean no-op
      # (a non-agent label like `bug`/`docs`, or self-routing): before
      # #1169 those events never touched routing secrets at all (Mint was
      # already gated on `steps.gate.outputs.skip`, and on the self-hosted
      # runner Tailscale-connect was skipped too). Resolving secrets FIRST
      # (unconditionally, as originally implemented) would turn every
      # irrelevant-label event into a hard job failure whenever this repo's
      # routing secrets happen to be incomplete — a regression #1169 must
      # not introduce. Gating secret-resolution + Tailscale on this step's
      # `skip` output (below) preserves the pre-#1169 no-op behavior
      # exactly. The other three route-by-* jobs have no such in-job early
      # exit, so first-step secret-resolution is correct there unchanged.
      - name: Label gate (skip non-agent labels + self-routing)
        id: gate
        env:
          EVENT_LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          LABEL="$EVENT_LABEL"
          APP_NAME=$(echo "$AGENTS" | jq -r --arg l "$LABEL" '.[$l].app_name // empty')
          if [ -z "$APP_NAME" ]; then
            echo "Label '$LABEL' is not an agent label, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ACTOR" = "${APP_NAME}[bot]" ]; then
            echo "Actor is the same agent, skipping self-routing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "agent-name=$LABEL" >> "$GITHUB_OUTPUT"
          echo "app-name=$APP_NAME" >> "$GITHUB_OUTPUT"

      # groundnuty/macf-actions#1169: resolves ROUTING_CLIENT_CERT/KEY (and
      # the other four routing secrets) from either MACF_ROUTING_BUNDLE or
      # the legacy six — see that step's own doc for the full contract.
      # Deliberately NOT in this job's `env:` block above (unlike the
      # pre-#1169 shape): a job-level `env: ROUTING_CLIENT_CERT: ${{
      # secrets.ROUTING_CLIENT_CERT }}` would just be an empty string for a
      # bundle-only caller, and this step's $GITHUB_ENV write is the ONLY
      # source of truth for these names in this job — no double-definition
      # to keep straight.
      - name: Resolve routing secrets (prefer MACF_ROUTING_BUNDLE — groundnuty/macf-actions#1169)
        id: resolve-routing-secrets
        if: steps.gate.outputs.skip != 'true'
        env:
          BUNDLE: ${{ secrets.MACF_ROUTING_BUNDLE }}
          IN_MACF_ROUTING_APP_ID: ${{ secrets.MACF_ROUTING_APP_ID }}
          IN_MACF_ROUTING_APP_KEY: ${{ secrets.MACF_ROUTING_APP_KEY }}
          IN_ROUTING_CLIENT_CERT: ${{ secrets.ROUTING_CLIENT_CERT }}
          IN_ROUTING_CLIENT_KEY: ${{ secrets.ROUTING_CLIENT_KEY }}
          IN_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          IN_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          # A fleet that hasn't declared Tailscale (apply-routing-secrets.ts's
          # 'not-required' leg — transport.tailscale_oauth_required defaults
          # to false, so this is the COMMON case) never gets TS_OAUTH_*
          # published as repo secrets. On the self-hosted `macf-vm` runner
          # (already tailnet-joined, macf-actions#64) that's fine — Connect
          # to Tailscale below never runs, so the fallback branch must not
          # require TS_OAUTH_* when this run won't actually consume it.
          TAILNET_NEEDED: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: |
          set -euo pipefail

          # groundnuty/macf#1169 / groundnuty/macf-actions#1169: a caller
          # generated by macf#1118+ passes ONE secret, MACF_ROUTING_BUNDLE
          # (base64(JSON) of these same six values, keyed by their own
          # secret names — apply-routing-secrets.ts::packRoutingBundle).
          # A legacy caller passes the six individually via
          # `secrets: inherit` or explicit listing. This step is the ONE
          # place that decides which source feeds every LATER step in
          # this job (they read the six under their original names,
          # either as a plain OS env var in `run:` steps, or via
          # `${{ env.NAME }}` in a `uses:` step's `with:` block).
          #
          # Additive, never a replacement: the bundle wins whenever the
          # caller supplied it (a present-but-malformed bundle fails
          # LOUD here rather than silently falling back to the six, even
          # if those happen to be present too — a bundle-packing bug
          # must never hide behind a coincidental fallback). The six are
          # the fallback ONLY when the caller supplied no bundle at all.
          # A caller supplying NEITHER fails loudly, naming exactly which
          # secret(s) are missing, before Tailscale connect or the
          # App-token mint ever run — never a partial run on empty
          # secrets (silent-fallback-hazards.md Pattern D: GitHub
          # substitutes empty string for an unsupplied secret, and an
          # empty-string routing secret must never be handed to curl/
          # create-github-app-token as if it were real).
          #
          # Never echoes a secret value — only names/counts appear in any
          # echo or ::error:: below. Every extracted value is masked
          # (line-by-line — GitHub's ::add-mask:: does not reliably
          # redact a value containing embedded newlines, and
          # MACF_ROUTING_APP_KEY is raw multi-line PEM; see
          # actions/runner#475) BEFORE it is written to $GITHUB_ENV.

          NAMES="MACF_ROUTING_APP_ID MACF_ROUTING_APP_KEY ROUTING_CLIENT_CERT ROUTING_CLIENT_KEY TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET"

          emit_secret() {
            # $1=name $2=value. Masks every line of $2 individually (a
            # single ::add-mask:: call on a multi-line string does not
            # reliably mask it — GH's masking is word/line-delimited),
            # then writes NAME to $GITHUB_ENV behind a random per-call
            # delimiter (GitHub's documented multiline-value pattern) so
            # a PEM value's own content can never collide with the
            # heredoc terminator.
            local name="$1" value="$2" delim line
            while IFS= read -r line || [ -n "$line" ]; do
              [ -n "$line" ] && echo "::add-mask::${line}"
            done <<< "$value"
            delim="ROUTING_SECRET_EOF_${name}_${RANDOM}${RANDOM}_$$"
            {
              echo "${name}<<${delim}"
              printf '%s\n' "$value"
              echo "$delim"
            } >> "$GITHUB_ENV"
          }

          if [ -n "${BUNDLE:-}" ]; then
            echo "routing secrets: MACF_ROUTING_BUNDLE supplied — bundle mode"
            if ! DECODED=$(printf '%s' "$BUNDLE" | base64 -d 2>/dev/null); then
              echo "::error::MACF_ROUTING_BUNDLE is not valid base64 — refusing to route on an unreadable bundle"
              exit 1
            fi
            if ! printf '%s' "$DECODED" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::MACF_ROUTING_BUNDLE decoded but is not a JSON object — refusing to route on a malformed bundle"
              exit 1
            fi
            MISSING=""
            for NAME in $NAMES; do
              VALUE=$(printf '%s' "$DECODED" | jq -r --arg k "$NAME" '.[$k] // empty')
              if [ -z "$VALUE" ]; then
                MISSING="${MISSING:+$MISSING, }$NAME"
                continue
              fi
              emit_secret "$NAME" "$VALUE"
            done
            unset DECODED
            if [ -n "$MISSING" ]; then
              echo "::error::MACF_ROUTING_BUNDLE is missing required key(s): $MISSING — refusing to route on a partial bundle"
              exit 1
            fi
            echo "routing secrets: unpacked all six values from MACF_ROUTING_BUNDLE"
          else
            echo "routing secrets: MACF_ROUTING_BUNDLE not supplied — falling back to the six individual secrets"
            MISSING=""
            for NAME in $NAMES; do
              case "$NAME" in
                MACF_ROUTING_APP_ID)  VALUE="${IN_MACF_ROUTING_APP_ID:-}" ;;
                MACF_ROUTING_APP_KEY) VALUE="${IN_MACF_ROUTING_APP_KEY:-}" ;;
                ROUTING_CLIENT_CERT)  VALUE="${IN_ROUTING_CLIENT_CERT:-}" ;;
                ROUTING_CLIENT_KEY)   VALUE="${IN_ROUTING_CLIENT_KEY:-}" ;;
                TS_OAUTH_CLIENT_ID)   VALUE="${IN_TS_OAUTH_CLIENT_ID:-}" ;;
                TS_OAUTH_SECRET)      VALUE="${IN_TS_OAUTH_SECRET:-}" ;;
              esac
              if [ -z "$VALUE" ]; then
                # TS_OAUTH_* is legitimately absent on a fleet that hasn't
                # declared Tailscale (the COMMON case — see this step's
                # `env:` doc for TAILNET_NEEDED). Only fail on a missing
                # TS_OAUTH_* when this run will actually attempt the
                # Tailscale connect; MACF_ROUTING_APP_ID/KEY and
                # ROUTING_CLIENT_CERT/KEY have no such carve-out.
                if { [ "$NAME" = "TS_OAUTH_CLIENT_ID" ] || [ "$NAME" = "TS_OAUTH_SECRET" ]; } \
                  && [ "${TAILNET_NEEDED:-true}" != "true" ]; then
                  echo "routing secrets: $NAME not supplied and not needed this run (self-hosted runner skips Tailscale connect) — leaving unset"
                  continue
                fi
                MISSING="${MISSING:+$MISSING, }$NAME"
                continue
              fi
              emit_secret "$NAME" "$VALUE"
            done
            if [ -n "$MISSING" ]; then
              echo "::error::Neither MACF_ROUTING_BUNDLE nor the following individual routing secret(s) were supplied: $MISSING — this caller cannot route. Pass MACF_ROUTING_BUNDLE (preferred, groundnuty/macf#1112) or all six secrets individually."
              echo "::error::Likely cause if you're a cross-org/enterprise caller: 'secrets: inherit' only propagates within the SAME organization/enterprise (GitHub docs) — see groundnuty/macf#1338, where a cross-org caller had all six secrets on its OWN repo but none reached this call. Pass the routing secrets explicitly in your caller workflow's 'secrets:' block, or supply MACF_ROUTING_BUNDLE."
              exit 1
            fi
            echo "routing secrets: resolved all six from the individually-supplied secrets"
          fi

      # macf-actions#64: the self-hosted `macf-vm` runner is ALREADY a
      # tailnet node (persistent VM) — re-running the ephemeral-runner
      # tailnet-join here is both redundant and observed to hard-fail
      # (`exit 1` at this step) on that runner, killing the job before
      # its mTLS POST. Skip join/assert/wait when origin-routing (#59)
      # picked the self-hosted runner; only github-hosted (ephemeral,
      # off-tailnet by default) needs to join. `needs.pick-runner.outputs.labels`
      # is a job output (always a string at this context — c.f. the
      # `fromJSON()` at this job's `runs-on:`), holding either the literal
      # string `"ubuntu-latest"` or `["self-hosted","macf-vm"]`; `contains()`
      # does a substring match against that raw string.
      #
      # groundnuty/macf-actions#1169: ALSO gated on `steps.gate.outputs.skip
      # != 'true'` (new) — an irrelevant-label / self-routing event must
      # stay a clean no-op, matching the pre-#1169 shape where this job
      # never touched Tailscale/secrets for such events on the self-hosted
      # path. `gate` runs first in this job specifically for this reason.
      - name: Connect to Tailscale
        if: ${{ steps.gate.outputs.skip != 'true' && !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci-runner

      - name: Assert tailnet is up (Instance 11 — connect can exit 0 on retry-exhaustion)
        if: ${{ steps.gate.outputs.skip != 'true' && !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: |
          tailscale status --json | jq -e '.BackendState == "Running"' >/dev/null \
            || { echo "::error::tailnet did not come up — BackendState != Running.";
                 echo "::error::The connect action may have exhausted retries and exited 0 anyway (bad TS_OAUTH_* or tag/ACL mismatch → Status 400 on every retry).";
                 tailscale status || true; exit 1; }
          echo "✓ tailnet up (BackendState=Running)"

      - name: Wait for Tailscale network
        if: ${{ steps.gate.outputs.skip != 'true' && !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: sleep 10

      - name: Mint registry-read token
        id: registry-token
        if: steps.gate.outputs.skip != 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.MACF_ROUTING_APP_ID }}
          private-key: ${{ env.MACF_ROUTING_APP_KEY }}
          owner: ${{ github.repository_owner }}
          # No permission-* subsetting: `macf-routing` is already a
          # minimum-scope App (metadata:read + actions_variables:read).
          # An earlier v3.0.0 iteration specified `permission-variables:
          # read` but that input isn't recognized by
          # actions/create-github-app-token@v3 — GitHub's API received
          # it as a subset-request and 422'd with "permissions not
          # granted to this installation". See groundnuty/macf-actions#20.

      - name: Resolve project CA cert (registry primary, repo-var fallback)
        id: ca-cert
        if: steps.gate.outputs.skip != 'true'
        # macf-actions#66: the CA cert is now resolved from the REGISTRY —
        # the same source + registry-read token minted just above for
        # host/port — instead of the per-repo `vars[...]` copy. `macf certs
        # init` writes `<PROJECT_SEG>_CA_CERT` into the registry, not onto
        # every caller repo, so the old vars[...] lookup was empty on every
        # freshly-bootstrapped fleet (groundnuty/macf#799/#806 outage
        # class). Precedence: registry wins when present; the per-repo var
        # (PROJECT_CA_CERT_REPO_VAR_FALLBACK, job env above) is read only
        # on a registry miss, for repos mid-migration; both-empty fails
        # loud so a misconfigured repo can't silently skip mTLS routing.
        env:
          GH_TOKEN: ${{ steps.registry-token.outputs.token }}
          REG_PATH: ${{ inputs.registry-api-path }}
        run: |
          set -euo pipefail
          CA_PATH=$(mktemp "${RUNNER_TEMP}/project-ca.XXXXXX.pem")
          if REGISTRY_CA=$(gh api "${REG_PATH}/actions/variables/${PROJECT_SEG}_CA_CERT" --jq '.value' 2>/dev/null) && [ -n "$REGISTRY_CA" ]; then
            printf '%s' "$REGISTRY_CA" > "$CA_PATH"
            echo "CA cert resolved from registry (${PROJECT_SEG}_CA_CERT)"
          elif [ -n "${PROJECT_CA_CERT_REPO_VAR_FALLBACK:-}" ]; then
            printf '%s' "$PROJECT_CA_CERT_REPO_VAR_FALLBACK" > "$CA_PATH"
            echo "::warning::CA cert resolved from the transitional per-repo vars[${PROJECT_SEG}_CA_CERT] fallback (registry miss). Set it in the registry via 'macf certs init' to close this gap — see macf-actions#66."
          else
            echo "::error::CA cert not found in the registry (${PROJECT_SEG}_CA_CERT under ${REG_PATH}) and no per-repo vars[${PROJECT_SEG}_CA_CERT] fallback is set. See macf-actions#66." >&2
            exit 1
          fi
          echo "path=${CA_PATH}" >> "$GITHUB_OUTPUT"

      - name: Resolve agent endpoint from registry
        id: endpoint
        if: steps.gate.outputs.skip != 'true'
        # Inlined in v3.1.0 (#27). Earlier v3.0.x kept the lookup in a
        # composite action at `.github/actions/resolve-agent-endpoint`
        # and used cross-repo checkout so external callers could
        # reach it. That path had two framework pitfalls — `uses:` at
        # step level doesn't evaluate ${{ github.* }} (so inline cross-
        # repo refs couldn't pin to the workflow's own ref), AND
        # `github.workflow_ref` itself is caller-scoped in reusable
        # workflows (documented quirk, community#31054). Inlining
        # kills both pitfalls: there's no cross-repo dependency to
        # pin because the shell IS the reusable workflow. route-by-
        # mention and route-by-ci-completion already inlined for the
        # same-loop reasons; parity now across all 3 jobs. Transform
        # logic still covered by test/resolve-agent-endpoint-transform.sh.
        env:
          GH_TOKEN: ${{ steps.registry-token.outputs.token }}
          REG_PATH: ${{ inputs.registry-api-path }}
          AGENT_NAME: ${{ steps.gate.outputs.agent-name }}
        run: |
          set -euo pipefail
          agent_seg=$(printf '%s' "$AGENT_NAME" | tr '[:lower:]-' '[:upper:]_')
          var_name="${PROJECT_SEG}_AGENT_${agent_seg}"
          if ! ENTRY=$(gh api "${REG_PATH}/actions/variables/${var_name}" --jq '.value' 2>/dev/null); then
            echo "::error::Registry miss: variable ${var_name} not found under ${REG_PATH}"
            exit 1
          fi
          HOST=$(echo "$ENTRY" | jq -r '.host // empty')
          PORT=$(echo "$ENTRY" | jq -r '.port // empty')
          if [ -z "$HOST" ] || [ -z "$PORT" ]; then
            echo "::error::Registry entry ${var_name} missing host or port (got host=${HOST:-<empty>} port=${PORT:-<empty>})"
            exit 1
          fi
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"

      - name: Route to agent by label (mTLS POST)
        if: steps.gate.outputs.skip != 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
          LABEL: ${{ steps.gate.outputs.agent-name }}
          APP_NAME: ${{ steps.gate.outputs.app-name }}
          HOST: ${{ steps.endpoint.outputs.host }}
          PORT: ${{ steps.endpoint.outputs.port }}
          CA_CERT_PATH: ${{ steps.ca-cert.outputs.path }}
        run: |
          set -euo pipefail

          # `repo` field added per macf-actions#30 — multi-homed agents
          # (e.g. macf-code-agent serving macf + macf-testbed +
          # macf-marketplace) need the origin-repo for any subsequent
          # `gh issue view` they run; bare issue numbers default to the
          # cwd's repo otherwise. Mirrors the route-by-mention path,
          # which has carried `--repo` in its MESSAGE since v2.0.
          PAYLOAD=$(jq -n \
            --arg type "issue_routed" --arg source "label" \
            --argjson issue_number "$ISSUE_NUMBER" --arg title "$ISSUE_TITLE" \
            --arg repo "$REPO" \
            '{type: $type, source: $source, issue_number: $issue_number, title: $title, repo: $repo}')

          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          cp "$CA_CERT_PATH" "$TMPDIR/ca.pem"
          echo "$ROUTING_CLIENT_CERT" | base64 -d > "$TMPDIR/c.pem"
          echo "$ROUTING_CLIENT_KEY"  | base64 -d > "$TMPDIR/k.pem"
          chmod 600 "$TMPDIR/k.pem"

          set +e
          HTTP_CODE=$(curl --silent --show-error \
            --cacert "$TMPDIR/ca.pem" --cert "$TMPDIR/c.pem" --key "$TMPDIR/k.pem" \
            --max-time 30 -X POST "https://${HOST}:${PORT}/notify" \
            -H 'Content-Type: application/json' -d "$PAYLOAD" \
            -o "$TMPDIR/r.txt" -w '%{http_code}')
          CURL_RC=$?
          set -e

          if [ "$CURL_RC" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
            echo "Routed issue #${ISSUE_NUMBER} to ${LABEL} via mTLS POST (HTTP 200)"
            exit 0
          fi

          echo "Agent ${LABEL} unreachable via mTLS (curl rc=$CURL_RC, HTTP=$HTTP_CODE); marking agent-offline"
          if [ -s "$TMPDIR/r.txt" ]; then echo "--- response ---" >&2; cat "$TMPDIR/r.txt" >&2; fi
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "agent-offline"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Agent \`${APP_NAME}[bot]\` is offline. Issue will be picked up when the agent starts."
          exit 1

      - name: Handle registry-miss as agent-offline
        if: steps.gate.outputs.skip != 'true' && failure() && steps.endpoint.outcome == 'failure'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APP_NAME: ${{ steps.gate.outputs.app-name }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "agent-offline"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Agent \`${APP_NAME}[bot]\` is not registered (registry miss). Issue will be picked up when the agent starts and registers."

  # ─── @MENTION ROUTING ───
  #
  # #58 (in-run dedup companion to #57): `needs` now includes
  # route-by-pr-review-state so this job can read its `notified` output
  # and skip re-notifying (via `mention`) any agent that job already
  # targeted with a `pr_review_state` POST for the SAME
  # pull_request_review event — closing the double-notify observed on
  # macf-devops-toolkit#120 (author also @mentioned in the review body
  # → got both "approved PR #N" AND "You were mentioned in PR #N").
  #
  # route-by-pr-review-state only ever runs on `pull_request_review`
  # (submitted, approved/changes_requested) — on every other event this
  # job fires on (`issue_comment`, `pull_request`, and
  # `pull_request_review` with state=commented/dismissed) that job is
  # SKIPPED by its own `if:`. Per GitHub's documented needs-propagation
  # ("if a job fails or is skipped, all jobs that need it are skipped
  # unless the jobs use a conditional expression that causes the job to
  # continue" — Actions docs, "Defining prerequisite jobs"), the
  # skip WOULD cascade to this job under the implicit default
  # `if: success()` (which additionally requires EVERY needed job —
  # including route-by-pr-review-state — to have succeeded). The fix is
  # NOT a blanket `!cancelled()` / `always()` override (that would also
  # let this job run with a broken $AGENTS if `config` itself failed,
  # a behavior change from today — `config` has no `if:` gate and
  # always attempts to run, so its failure is a real possibility this
  # job must still stand down on, exactly as it did before this needs-
  # chain existed). Instead: gate explicitly on
  # `needs.config.result == 'success'` (preserves today's config-
  # dependency semantics exactly) while deliberately NOT checking
  # route-by-pr-review-state's result at all — skipped, succeeded, or
  # failed, this job runs regardless, decoupling mention-routing from
  # review-state-routing's outcome per #58. `!cancelled()` is added as
  # documented defense-in-depth against a cancellation landing in the
  # narrow window between `config` finishing and this job starting
  # (preferred over `always()`, which the docs flag as also forcing a
  # run through an in-flight cancellation). The trigger condition
  # itself is unchanged — restated here because adding any custom `if:`
  # replaces the implicit default, so the original three-event gate has
  # to be spelled out explicitly alongside the two status checks.
  route-by-mention:
    needs: [config, pick-runner, route-by-pr-review-state]
    if: >
      (needs.config.result == 'success') &&
      (!cancelled()) &&
      (
        (github.event_name == 'issue_comment') ||
        (github.event_name == 'pull_request') ||
        (github.event_name == 'pull_request_review')
      )
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    env:
      AGENTS: ${{ needs.config.outputs.agents }}
      # macf-actions#66: TRANSITIONAL fallback only — the per-repo `vars[...]`
      # copy of the CA cert. The registry (see the "Resolve project CA cert"
      # step below) is now the primary source, same as host/port.
      PROJECT_CA_CERT_REPO_VAR_FALLBACK: ${{ vars[format('{0}_CA_CERT', needs.config.outputs.project-seg)] }}
      PROJECT_SEG: ${{ needs.config.outputs.project-seg }}
      # Empty string on every event where route-by-pr-review-state
      # didn't run/notify anyone this run (issue_comment, pull_request,
      # or a pull_request_review whose state was commented/dismissed,
      # or one where it found no registered recipient) — safe no-op
      # membership check below in all those cases.
      #
      # Bracket ("index") notation, NOT dot notation — the job id
      # contains hyphens, which dot-property-dereference doesn't parse
      # as part of the identifier. `needs['route-by-pr-review-state']`
      # is the unambiguous form regardless.
      REVIEW_STATE_NOTIFIED: ${{ needs['route-by-pr-review-state'].outputs.notified }}
    steps:
      # groundnuty/macf-actions#1169: resolves ROUTING_CLIENT_CERT/KEY (and
      # the other four routing secrets) from either MACF_ROUTING_BUNDLE or
      # the legacy six — see that step's own doc for the full contract.
      # Deliberately NOT in this job's `env:` block above (unlike the
      # pre-#1169 shape): a job-level `env: ROUTING_CLIENT_CERT: ${{
      # secrets.ROUTING_CLIENT_CERT }}` would just be an empty string for a
      # bundle-only caller, and this step's $GITHUB_ENV write is the ONLY
      # source of truth for these names in this job — no double-definition
      # to keep straight.
      - name: Resolve routing secrets (prefer MACF_ROUTING_BUNDLE — groundnuty/macf-actions#1169)
        id: resolve-routing-secrets
        env:
          BUNDLE: ${{ secrets.MACF_ROUTING_BUNDLE }}
          IN_MACF_ROUTING_APP_ID: ${{ secrets.MACF_ROUTING_APP_ID }}
          IN_MACF_ROUTING_APP_KEY: ${{ secrets.MACF_ROUTING_APP_KEY }}
          IN_ROUTING_CLIENT_CERT: ${{ secrets.ROUTING_CLIENT_CERT }}
          IN_ROUTING_CLIENT_KEY: ${{ secrets.ROUTING_CLIENT_KEY }}
          IN_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          IN_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          # A fleet that hasn't declared Tailscale (apply-routing-secrets.ts's
          # 'not-required' leg — transport.tailscale_oauth_required defaults
          # to false, so this is the COMMON case) never gets TS_OAUTH_*
          # published as repo secrets. On the self-hosted `macf-vm` runner
          # (already tailnet-joined, macf-actions#64) that's fine — Connect
          # to Tailscale below never runs, so the fallback branch must not
          # require TS_OAUTH_* when this run won't actually consume it.
          TAILNET_NEEDED: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: |
          set -euo pipefail

          # groundnuty/macf#1169 / groundnuty/macf-actions#1169: a caller
          # generated by macf#1118+ passes ONE secret, MACF_ROUTING_BUNDLE
          # (base64(JSON) of these same six values, keyed by their own
          # secret names — apply-routing-secrets.ts::packRoutingBundle).
          # A legacy caller passes the six individually via
          # `secrets: inherit` or explicit listing. This step is the ONE
          # place that decides which source feeds every LATER step in
          # this job (they read the six under their original names,
          # either as a plain OS env var in `run:` steps, or via
          # `${{ env.NAME }}` in a `uses:` step's `with:` block).
          #
          # Additive, never a replacement: the bundle wins whenever the
          # caller supplied it (a present-but-malformed bundle fails
          # LOUD here rather than silently falling back to the six, even
          # if those happen to be present too — a bundle-packing bug
          # must never hide behind a coincidental fallback). The six are
          # the fallback ONLY when the caller supplied no bundle at all.
          # A caller supplying NEITHER fails loudly, naming exactly which
          # secret(s) are missing, before Tailscale connect or the
          # App-token mint ever run — never a partial run on empty
          # secrets (silent-fallback-hazards.md Pattern D: GitHub
          # substitutes empty string for an unsupplied secret, and an
          # empty-string routing secret must never be handed to curl/
          # create-github-app-token as if it were real).
          #
          # Never echoes a secret value — only names/counts appear in any
          # echo or ::error:: below. Every extracted value is masked
          # (line-by-line — GitHub's ::add-mask:: does not reliably
          # redact a value containing embedded newlines, and
          # MACF_ROUTING_APP_KEY is raw multi-line PEM; see
          # actions/runner#475) BEFORE it is written to $GITHUB_ENV.

          NAMES="MACF_ROUTING_APP_ID MACF_ROUTING_APP_KEY ROUTING_CLIENT_CERT ROUTING_CLIENT_KEY TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET"

          emit_secret() {
            # $1=name $2=value. Masks every line of $2 individually (a
            # single ::add-mask:: call on a multi-line string does not
            # reliably mask it — GH's masking is word/line-delimited),
            # then writes NAME to $GITHUB_ENV behind a random per-call
            # delimiter (GitHub's documented multiline-value pattern) so
            # a PEM value's own content can never collide with the
            # heredoc terminator.
            local name="$1" value="$2" delim line
            while IFS= read -r line || [ -n "$line" ]; do
              [ -n "$line" ] && echo "::add-mask::${line}"
            done <<< "$value"
            delim="ROUTING_SECRET_EOF_${name}_${RANDOM}${RANDOM}_$$"
            {
              echo "${name}<<${delim}"
              printf '%s\n' "$value"
              echo "$delim"
            } >> "$GITHUB_ENV"
          }

          if [ -n "${BUNDLE:-}" ]; then
            echo "routing secrets: MACF_ROUTING_BUNDLE supplied — bundle mode"
            if ! DECODED=$(printf '%s' "$BUNDLE" | base64 -d 2>/dev/null); then
              echo "::error::MACF_ROUTING_BUNDLE is not valid base64 — refusing to route on an unreadable bundle"
              exit 1
            fi
            if ! printf '%s' "$DECODED" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::MACF_ROUTING_BUNDLE decoded but is not a JSON object — refusing to route on a malformed bundle"
              exit 1
            fi
            MISSING=""
            for NAME in $NAMES; do
              VALUE=$(printf '%s' "$DECODED" | jq -r --arg k "$NAME" '.[$k] // empty')
              if [ -z "$VALUE" ]; then
                MISSING="${MISSING:+$MISSING, }$NAME"
                continue
              fi
              emit_secret "$NAME" "$VALUE"
            done
            unset DECODED
            if [ -n "$MISSING" ]; then
              echo "::error::MACF_ROUTING_BUNDLE is missing required key(s): $MISSING — refusing to route on a partial bundle"
              exit 1
            fi
            echo "routing secrets: unpacked all six values from MACF_ROUTING_BUNDLE"
          else
            echo "routing secrets: MACF_ROUTING_BUNDLE not supplied — falling back to the six individual secrets"
            MISSING=""
            for NAME in $NAMES; do
              case "$NAME" in
                MACF_ROUTING_APP_ID)  VALUE="${IN_MACF_ROUTING_APP_ID:-}" ;;
                MACF_ROUTING_APP_KEY) VALUE="${IN_MACF_ROUTING_APP_KEY:-}" ;;
                ROUTING_CLIENT_CERT)  VALUE="${IN_ROUTING_CLIENT_CERT:-}" ;;
                ROUTING_CLIENT_KEY)   VALUE="${IN_ROUTING_CLIENT_KEY:-}" ;;
                TS_OAUTH_CLIENT_ID)   VALUE="${IN_TS_OAUTH_CLIENT_ID:-}" ;;
                TS_OAUTH_SECRET)      VALUE="${IN_TS_OAUTH_SECRET:-}" ;;
              esac
              if [ -z "$VALUE" ]; then
                # TS_OAUTH_* is legitimately absent on a fleet that hasn't
                # declared Tailscale (the COMMON case — see this step's
                # `env:` doc for TAILNET_NEEDED). Only fail on a missing
                # TS_OAUTH_* when this run will actually attempt the
                # Tailscale connect; MACF_ROUTING_APP_ID/KEY and
                # ROUTING_CLIENT_CERT/KEY have no such carve-out.
                if { [ "$NAME" = "TS_OAUTH_CLIENT_ID" ] || [ "$NAME" = "TS_OAUTH_SECRET" ]; } \
                  && [ "${TAILNET_NEEDED:-true}" != "true" ]; then
                  echo "routing secrets: $NAME not supplied and not needed this run (self-hosted runner skips Tailscale connect) — leaving unset"
                  continue
                fi
                MISSING="${MISSING:+$MISSING, }$NAME"
                continue
              fi
              emit_secret "$NAME" "$VALUE"
            done
            if [ -n "$MISSING" ]; then
              echo "::error::Neither MACF_ROUTING_BUNDLE nor the following individual routing secret(s) were supplied: $MISSING — this caller cannot route. Pass MACF_ROUTING_BUNDLE (preferred, groundnuty/macf#1112) or all six secrets individually."
              echo "::error::Likely cause if you're a cross-org/enterprise caller: 'secrets: inherit' only propagates within the SAME organization/enterprise (GitHub docs) — see groundnuty/macf#1338, where a cross-org caller had all six secrets on its OWN repo but none reached this call. Pass the routing secrets explicitly in your caller workflow's 'secrets:' block, or supply MACF_ROUTING_BUNDLE."
              exit 1
            fi
            echo "routing secrets: resolved all six from the individually-supplied secrets"
          fi

      # macf-actions#64: the self-hosted `macf-vm` runner is ALREADY a
      # tailnet node (persistent VM) — re-running the ephemeral-runner
      # tailnet-join here is both redundant and observed to hard-fail
      # (`exit 1` at this step) on that runner, killing the job before
      # its mTLS POST. Skip join/assert/wait when origin-routing (#59)
      # picked the self-hosted runner; only github-hosted (ephemeral,
      # off-tailnet by default) needs to join. `needs.pick-runner.outputs.labels`
      # is a job output (always a string at this context — c.f. the
      # `fromJSON()` at this job's `runs-on:`), holding either the literal
      # string `"ubuntu-latest"` or `["self-hosted","macf-vm"]`; `contains()`
      # does a substring match against that raw string.
      - name: Connect to Tailscale
        if: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci-runner

      - name: Assert tailnet is up (Instance 11 — connect can exit 0 on retry-exhaustion)
        if: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: |
          tailscale status --json | jq -e '.BackendState == "Running"' >/dev/null \
            || { echo "::error::tailnet did not come up — BackendState != Running.";
                 echo "::error::The connect action may have exhausted retries and exited 0 anyway (bad TS_OAUTH_* or tag/ACL mismatch → Status 400 on every retry).";
                 tailscale status || true; exit 1; }
          echo "✓ tailnet up (BackendState=Running)"

      - name: Wait for Tailscale network
        if: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: sleep 10

      - name: Mint registry-read token
        id: registry-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.MACF_ROUTING_APP_ID }}
          private-key: ${{ env.MACF_ROUTING_APP_KEY }}
          owner: ${{ github.repository_owner }}
          # No permission-* subsetting: `macf-routing` is already a
          # minimum-scope App (metadata:read + actions_variables:read).
          # An earlier v3.0.0 iteration specified `permission-variables:
          # read` but that input isn't recognized by
          # actions/create-github-app-token@v3 — GitHub's API received
          # it as a subset-request and 422'd with "permissions not
          # granted to this installation". See groundnuty/macf-actions#20.

      - name: Resolve project CA cert (registry primary, repo-var fallback)
        id: ca-cert
        # macf-actions#66: see route-by-label's identically-named step for
        # the full rationale — registry primary (same registry-read token
        # minted above), per-repo vars[...] transitional fallback,
        # both-empty fails loud (groundnuty/macf#799/#806 outage class).
        env:
          GH_TOKEN: ${{ steps.registry-token.outputs.token }}
          REG_PATH: ${{ inputs.registry-api-path }}
        run: |
          set -euo pipefail
          CA_PATH=$(mktemp "${RUNNER_TEMP}/project-ca.XXXXXX.pem")
          if REGISTRY_CA=$(gh api "${REG_PATH}/actions/variables/${PROJECT_SEG}_CA_CERT" --jq '.value' 2>/dev/null) && [ -n "$REGISTRY_CA" ]; then
            printf '%s' "$REGISTRY_CA" > "$CA_PATH"
            echo "CA cert resolved from registry (${PROJECT_SEG}_CA_CERT)"
          elif [ -n "${PROJECT_CA_CERT_REPO_VAR_FALLBACK:-}" ]; then
            printf '%s' "$PROJECT_CA_CERT_REPO_VAR_FALLBACK" > "$CA_PATH"
            echo "::warning::CA cert resolved from the transitional per-repo vars[${PROJECT_SEG}_CA_CERT] fallback (registry miss). Set it in the registry via 'macf certs init' to close this gap — see macf-actions#66."
          else
            echo "::error::CA cert not found in the registry (${PROJECT_SEG}_CA_CERT under ${REG_PATH}) and no per-repo vars[${PROJECT_SEG}_CA_CERT] fallback is set. See macf-actions#66." >&2
            exit 1
          fi
          echo "path=${CA_PATH}" >> "$GITHUB_OUTPUT"

      - name: Route to mentioned agents (mTLS POST)
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          REVIEW_USER: ${{ github.event.review.user.login }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REG_TOKEN: ${{ steps.registry-token.outputs.token }}
          REG_PATH: ${{ inputs.registry-api-path }}
          CA_CERT_PATH: ${{ steps.ca-cert.outputs.path }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            issue_comment) BODY="$COMMENT_BODY"; ACTOR="$COMMENT_USER"; REF="issue #${ISSUE_NUMBER}"; VIEW_NUM="$ISSUE_NUMBER" ;;
            pull_request) BODY="$PR_BODY"; ACTOR="$PR_USER"; REF="PR #${PR_NUMBER}"; VIEW_NUM="$PR_NUMBER" ;;
            pull_request_review) BODY="$REVIEW_BODY"; ACTOR="$REVIEW_USER"; REF="PR #${PR_NUMBER}"; VIEW_NUM="$PR_NUMBER" ;;
            *) BODY="$COMMENT_BODY"; ACTOR="$COMMENT_USER"; REF="PR #${PR_NUMBER}"; VIEW_NUM="$PR_NUMBER" ;;
          esac

          [ "$ACTOR" = "github-actions[bot]" ] && { echo "skip github-actions[bot]"; exit 0; }

          # Strip Markdown code-context from $BODY before the @mention match
          # (groundnuty/macf-actions#33). PR/issue/review bodies that mention
          # @bot[bot] inside ```...``` fences or `inline` code (e.g. PR
          # descriptions quoting future trigger heredoc content, or scenario
          # test-case documentation) should NOT fire routing —
          # `mention-routing-hygiene.md` (canonical) prescribes backticking
          # handles in describing contexts, but the pre-#33 matcher ignored
          # GitHub's autolink semantics. This strip aligns the matcher with
          # rendered intent: if GitHub renders as inline code (no autolink),
          # the router doesn't route.
          #
          # Implementation (ReDoS-safe — awk patterns line-anchored, sed
          # bounded by [^`]*):
          #   1. Awk state machine strips fenced blocks (```...```).
          #   2. Sed strips inline code spans (`...`).
          #
          # $BODY is passed via env (`COMMENT_BODY` / `PR_BODY` / `REVIEW_BODY`
          # set in the step env: block from `${{ github.event.*.body }}`),
          # NOT inline-interpolated into the run: block — printf %s preserves
          # arbitrary content safely.
          BODY_CLEAN=$(printf '%s' "$BODY" | awk '
            /^```/ { inside_fence = !inside_fence; next }
            inside_fence { next }
            { print }
          ' | sed -E 's/`[^`]*`//g')

          TMPDIR=$(mktemp -d); trap 'rm -rf "$TMPDIR"' EXIT
          cp "$CA_CERT_PATH" "$TMPDIR/ca.pem"
          echo "$ROUTING_CLIENT_CERT" | base64 -d > "$TMPDIR/c.pem"
          echo "$ROUTING_CLIENT_KEY"  | base64 -d > "$TMPDIR/k.pem"
          chmod 600 "$TMPDIR/k.pem"

          for AGENT_NAME in $(echo "$AGENTS" | jq -r 'keys[]'); do
            APP_NAME=$(echo "$AGENTS" | jq -r --arg a "$AGENT_NAME" '.[$a].app_name // empty')
            [ "$ACTOR" = "${APP_NAME}[bot]" ] && continue

            # #58: on a pull_request_review event, route-by-pr-review-state
            # (which runs first per this job's needs:) already routed a
            # pr_review_state POST to this exact recipient set this run —
            # skip the redundant `mention` so the agent isn't notified
            # twice for one review (macf-devops-toolkit#120). Exact-token
            # match on the space-delimited list, bounded both sides so a
            # hyphenated name can't partially match a different agent.
            # REVIEW_STATE_NOTIFIED is empty on every non-review event and
            # on review events route-by-pr-review-state didn't act on
            # (commented/dismissed state, or no registered recipient) —
            # the check is then always false, no over-suppression.
            if [ "$EVENT_NAME" = "pull_request_review" ]; then
              case " ${REVIEW_STATE_NOTIFIED:-} " in
                *" $AGENT_NAME "*)
                  echo "Skipping mention route to ${AGENT_NAME}: already notified via pr_review_state this run"
                  continue
                  ;;
              esac
            fi

            # Fixed-string match instead of regex: $BODY_CLEAN is user-
            # controlled (issue comment, PR body, review body) but with
            # Markdown code-context (fenced blocks + inline code spans)
            # already stripped per groundnuty/macf-actions#33. Regex
            # interpretation risked catastrophic backtracking on crafted
            # input (ReDoS) — filed as groundnuty/macf-actions#13.
            # Semantically we want a literal substring check for
            # "@<name>[bot]" outside code-context, which is grep -F on the
            # cleaned body. Two `-e` terms cover the alternation.
            if printf '%s' "$BODY_CLEAN" | grep -qF -e "@${AGENT_NAME}[bot]" -e "@${APP_NAME}[bot]"; then
              # Inline registry lookup: loop-driven, so `uses: composite`
              # isn't an option here (steps are static). Transform identical
              # to .github/actions/resolve-agent-endpoint and covered by
              # test/resolve-agent-endpoint-transform.sh.
              AGENT_SEG=$(printf '%s' "$AGENT_NAME" | tr '[:lower:]-' '[:upper:]_')
              VAR_NAME="${PROJECT_SEG}_AGENT_${AGENT_SEG}"

              set +e
              ENTRY=$(GH_TOKEN="$REG_TOKEN" gh api "${REG_PATH}/actions/variables/${VAR_NAME}" --jq '.value' 2>/dev/null)
              API_RC=$?
              set -e
              if [ "$API_RC" -ne 0 ] || [ -z "$ENTRY" ]; then
                echo "Registry miss for ${AGENT_NAME} (${VAR_NAME}); skipping mention route"
                continue
              fi
              HOST=$(echo "$ENTRY" | jq -r '.host // empty')
              PORT=$(echo "$ENTRY" | jq -r '.port // empty')
              if [ -z "$HOST" ] || [ -z "$PORT" ]; then
                echo "Registry entry ${VAR_NAME} missing host or port; skipping" >&2
                continue
              fi

              MESSAGE="You were mentioned in ${REF}. Please check and respond: gh issue view ${VIEW_NUM} --repo ${REPO} --json title,body,comments"
              PAYLOAD=$(jq -n --arg type "mention" --arg source "mention" --argjson issue_number "$VIEW_NUM" --arg message "$MESSAGE" \
                '{type: $type, source: $source, issue_number: $issue_number, message: $message}')

              set +e
              HTTP_CODE=$(curl --silent --show-error \
                --cacert "$TMPDIR/ca.pem" --cert "$TMPDIR/c.pem" --key "$TMPDIR/k.pem" \
                --max-time 30 -X POST "https://${HOST}:${PORT}/notify" \
                -H 'Content-Type: application/json' -d "$PAYLOAD" \
                -o "$TMPDIR/r.txt" -w '%{http_code}')
              CURL_RC=$?
              set -e

              if [ "$CURL_RC" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
                echo "Routed mention to ${AGENT_NAME} via mTLS POST"
              else
                echo "Agent ${AGENT_NAME} unreachable via mTLS (rc=$CURL_RC HTTP=$HTTP_CODE); skipping (mention events don't mark agent-offline)"
              fi
            fi
          done

  # ─── CI COMPLETION ROUTING ───
  route-by-ci-completion:
    needs: [config, pick-runner]
    if: >
      (github.event_name == 'check_suite') &&
      (github.event.action == 'completed')
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    env:
      AGENTS: ${{ needs.config.outputs.agents }}
      # macf-actions#66: TRANSITIONAL fallback only — the per-repo `vars[...]`
      # copy of the CA cert. The registry (see the "Resolve project CA cert"
      # step below) is now the primary source, same as host/port.
      PROJECT_CA_CERT_REPO_VAR_FALLBACK: ${{ vars[format('{0}_CA_CERT', needs.config.outputs.project-seg)] }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHECK_SUITE_ID: ${{ github.event.check_suite.id }}
      CHECK_SUITE_HEAD_SHA: ${{ github.event.check_suite.head_sha }}
      CHECK_SUITE_CONCLUSION: ${{ github.event.check_suite.conclusion }}
      REPO: ${{ github.repository }}
      PROJECT_SEG: ${{ needs.config.outputs.project-seg }}
    steps:
      # No composite-action checkout here — route-by-ci-completion
      # uses the inline registry lookup (loop-driven, can't use the
      # composite). Previously had a sparse-checkout as defensive
      # leftover; removed in v3.0.2. See groundnuty/macf-actions#22.
      #
      # groundnuty/macf-actions#1169: resolves ROUTING_CLIENT_CERT/KEY
      # (and the other four routing secrets) from either
      # MACF_ROUTING_BUNDLE or the legacy six — see that step's own doc
      # for the full contract. Deliberately NOT in this job's `env:`
      # block above (unlike the pre-#1169 shape): a job-level `env:
      # ROUTING_CLIENT_CERT: ${{ secrets.ROUTING_CLIENT_CERT }}` would
      # just be an empty string for a bundle-only caller, and this
      # step's $GITHUB_ENV write is the ONLY source of truth for these
      # names in this job — no double-definition to keep straight.
      - name: Resolve routing secrets (prefer MACF_ROUTING_BUNDLE — groundnuty/macf-actions#1169)
        id: resolve-routing-secrets
        env:
          BUNDLE: ${{ secrets.MACF_ROUTING_BUNDLE }}
          IN_MACF_ROUTING_APP_ID: ${{ secrets.MACF_ROUTING_APP_ID }}
          IN_MACF_ROUTING_APP_KEY: ${{ secrets.MACF_ROUTING_APP_KEY }}
          IN_ROUTING_CLIENT_CERT: ${{ secrets.ROUTING_CLIENT_CERT }}
          IN_ROUTING_CLIENT_KEY: ${{ secrets.ROUTING_CLIENT_KEY }}
          IN_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          IN_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          # A fleet that hasn't declared Tailscale (apply-routing-secrets.ts's
          # 'not-required' leg — transport.tailscale_oauth_required defaults
          # to false, so this is the COMMON case) never gets TS_OAUTH_*
          # published as repo secrets. On the self-hosted `macf-vm` runner
          # (already tailnet-joined, macf-actions#64) that's fine — Connect
          # to Tailscale below never runs, so the fallback branch must not
          # require TS_OAUTH_* when this run won't actually consume it.
          TAILNET_NEEDED: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: |
          set -euo pipefail

          # groundnuty/macf#1169 / groundnuty/macf-actions#1169: a caller
          # generated by macf#1118+ passes ONE secret, MACF_ROUTING_BUNDLE
          # (base64(JSON) of these same six values, keyed by their own
          # secret names — apply-routing-secrets.ts::packRoutingBundle).
          # A legacy caller passes the six individually via
          # `secrets: inherit` or explicit listing. This step is the ONE
          # place that decides which source feeds every LATER step in
          # this job (they read the six under their original names,
          # either as a plain OS env var in `run:` steps, or via
          # `${{ env.NAME }}` in a `uses:` step's `with:` block).
          #
          # Additive, never a replacement: the bundle wins whenever the
          # caller supplied it (a present-but-malformed bundle fails
          # LOUD here rather than silently falling back to the six, even
          # if those happen to be present too — a bundle-packing bug
          # must never hide behind a coincidental fallback). The six are
          # the fallback ONLY when the caller supplied no bundle at all.
          # A caller supplying NEITHER fails loudly, naming exactly which
          # secret(s) are missing, before Tailscale connect or the
          # App-token mint ever run — never a partial run on empty
          # secrets (silent-fallback-hazards.md Pattern D: GitHub
          # substitutes empty string for an unsupplied secret, and an
          # empty-string routing secret must never be handed to curl/
          # create-github-app-token as if it were real).
          #
          # Never echoes a secret value — only names/counts appear in any
          # echo or ::error:: below. Every extracted value is masked
          # (line-by-line — GitHub's ::add-mask:: does not reliably
          # redact a value containing embedded newlines, and
          # MACF_ROUTING_APP_KEY is raw multi-line PEM; see
          # actions/runner#475) BEFORE it is written to $GITHUB_ENV.

          NAMES="MACF_ROUTING_APP_ID MACF_ROUTING_APP_KEY ROUTING_CLIENT_CERT ROUTING_CLIENT_KEY TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET"

          emit_secret() {
            # $1=name $2=value. Masks every line of $2 individually (a
            # single ::add-mask:: call on a multi-line string does not
            # reliably mask it — GH's masking is word/line-delimited),
            # then writes NAME to $GITHUB_ENV behind a random per-call
            # delimiter (GitHub's documented multiline-value pattern) so
            # a PEM value's own content can never collide with the
            # heredoc terminator.
            local name="$1" value="$2" delim line
            while IFS= read -r line || [ -n "$line" ]; do
              [ -n "$line" ] && echo "::add-mask::${line}"
            done <<< "$value"
            delim="ROUTING_SECRET_EOF_${name}_${RANDOM}${RANDOM}_$$"
            {
              echo "${name}<<${delim}"
              printf '%s\n' "$value"
              echo "$delim"
            } >> "$GITHUB_ENV"
          }

          if [ -n "${BUNDLE:-}" ]; then
            echo "routing secrets: MACF_ROUTING_BUNDLE supplied — bundle mode"
            if ! DECODED=$(printf '%s' "$BUNDLE" | base64 -d 2>/dev/null); then
              echo "::error::MACF_ROUTING_BUNDLE is not valid base64 — refusing to route on an unreadable bundle"
              exit 1
            fi
            if ! printf '%s' "$DECODED" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::MACF_ROUTING_BUNDLE decoded but is not a JSON object — refusing to route on a malformed bundle"
              exit 1
            fi
            MISSING=""
            for NAME in $NAMES; do
              VALUE=$(printf '%s' "$DECODED" | jq -r --arg k "$NAME" '.[$k] // empty')
              if [ -z "$VALUE" ]; then
                MISSING="${MISSING:+$MISSING, }$NAME"
                continue
              fi
              emit_secret "$NAME" "$VALUE"
            done
            unset DECODED
            if [ -n "$MISSING" ]; then
              echo "::error::MACF_ROUTING_BUNDLE is missing required key(s): $MISSING — refusing to route on a partial bundle"
              exit 1
            fi
            echo "routing secrets: unpacked all six values from MACF_ROUTING_BUNDLE"
          else
            echo "routing secrets: MACF_ROUTING_BUNDLE not supplied — falling back to the six individual secrets"
            MISSING=""
            for NAME in $NAMES; do
              case "$NAME" in
                MACF_ROUTING_APP_ID)  VALUE="${IN_MACF_ROUTING_APP_ID:-}" ;;
                MACF_ROUTING_APP_KEY) VALUE="${IN_MACF_ROUTING_APP_KEY:-}" ;;
                ROUTING_CLIENT_CERT)  VALUE="${IN_ROUTING_CLIENT_CERT:-}" ;;
                ROUTING_CLIENT_KEY)   VALUE="${IN_ROUTING_CLIENT_KEY:-}" ;;
                TS_OAUTH_CLIENT_ID)   VALUE="${IN_TS_OAUTH_CLIENT_ID:-}" ;;
                TS_OAUTH_SECRET)      VALUE="${IN_TS_OAUTH_SECRET:-}" ;;
              esac
              if [ -z "$VALUE" ]; then
                # TS_OAUTH_* is legitimately absent on a fleet that hasn't
                # declared Tailscale (the COMMON case — see this step's
                # `env:` doc for TAILNET_NEEDED). Only fail on a missing
                # TS_OAUTH_* when this run will actually attempt the
                # Tailscale connect; MACF_ROUTING_APP_ID/KEY and
                # ROUTING_CLIENT_CERT/KEY have no such carve-out.
                if { [ "$NAME" = "TS_OAUTH_CLIENT_ID" ] || [ "$NAME" = "TS_OAUTH_SECRET" ]; } \
                  && [ "${TAILNET_NEEDED:-true}" != "true" ]; then
                  echo "routing secrets: $NAME not supplied and not needed this run (self-hosted runner skips Tailscale connect) — leaving unset"
                  continue
                fi
                MISSING="${MISSING:+$MISSING, }$NAME"
                continue
              fi
              emit_secret "$NAME" "$VALUE"
            done
            if [ -n "$MISSING" ]; then
              echo "::error::Neither MACF_ROUTING_BUNDLE nor the following individual routing secret(s) were supplied: $MISSING — this caller cannot route. Pass MACF_ROUTING_BUNDLE (preferred, groundnuty/macf#1112) or all six secrets individually."
              echo "::error::Likely cause if you're a cross-org/enterprise caller: 'secrets: inherit' only propagates within the SAME organization/enterprise (GitHub docs) — see groundnuty/macf#1338, where a cross-org caller had all six secrets on its OWN repo but none reached this call. Pass the routing secrets explicitly in your caller workflow's 'secrets:' block, or supply MACF_ROUTING_BUNDLE."
              exit 1
            fi
            echo "routing secrets: resolved all six from the individually-supplied secrets"
          fi

      # macf-actions#64: the self-hosted `macf-vm` runner is ALREADY a
      # tailnet node (persistent VM) — re-running the ephemeral-runner
      # tailnet-join here is both redundant and observed to hard-fail
      # (`exit 1` at this step) on that runner, killing the job before
      # its mTLS POST. Skip join/assert/wait when origin-routing (#59)
      # picked the self-hosted runner; only github-hosted (ephemeral,
      # off-tailnet by default) needs to join. `needs.pick-runner.outputs.labels`
      # is a job output (always a string at this context — c.f. the
      # `fromJSON()` at this job's `runs-on:`), holding either the literal
      # string `"ubuntu-latest"` or `["self-hosted","macf-vm"]`; `contains()`
      # does a substring match against that raw string.
      - name: Connect to Tailscale
        if: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci-runner

      - name: Assert tailnet is up (Instance 11 — connect can exit 0 on retry-exhaustion)
        if: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: |
          tailscale status --json | jq -e '.BackendState == "Running"' >/dev/null \
            || { echo "::error::tailnet did not come up — BackendState != Running.";
                 echo "::error::The connect action may have exhausted retries and exited 0 anyway (bad TS_OAUTH_* or tag/ACL mismatch → Status 400 on every retry).";
                 tailscale status || true; exit 1; }
          echo "✓ tailnet up (BackendState=Running)"

      - name: Wait for Tailscale network
        if: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: sleep 10

      - name: Mint registry-read token
        id: registry-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.MACF_ROUTING_APP_ID }}
          private-key: ${{ env.MACF_ROUTING_APP_KEY }}
          owner: ${{ github.repository_owner }}
          # No permission-* subsetting: `macf-routing` is already a
          # minimum-scope App (metadata:read + actions_variables:read).
          # An earlier v3.0.0 iteration specified `permission-variables:
          # read` but that input isn't recognized by
          # actions/create-github-app-token@v3 — GitHub's API received
          # it as a subset-request and 422'd with "permissions not
          # granted to this installation". See groundnuty/macf-actions#20.

      - name: Resolve project CA cert (registry primary, repo-var fallback)
        id: ca-cert
        # macf-actions#66: see route-by-label's identically-named step for
        # the full rationale — registry primary (same registry-read token
        # minted above), per-repo vars[...] transitional fallback,
        # both-empty fails loud (groundnuty/macf#799/#806 outage class).
        env:
          GH_TOKEN: ${{ steps.registry-token.outputs.token }}
          REG_PATH: ${{ inputs.registry-api-path }}
        run: |
          set -euo pipefail
          CA_PATH=$(mktemp "${RUNNER_TEMP}/project-ca.XXXXXX.pem")
          if REGISTRY_CA=$(gh api "${REG_PATH}/actions/variables/${PROJECT_SEG}_CA_CERT" --jq '.value' 2>/dev/null) && [ -n "$REGISTRY_CA" ]; then
            printf '%s' "$REGISTRY_CA" > "$CA_PATH"
            echo "CA cert resolved from registry (${PROJECT_SEG}_CA_CERT)"
          elif [ -n "${PROJECT_CA_CERT_REPO_VAR_FALLBACK:-}" ]; then
            printf '%s' "$PROJECT_CA_CERT_REPO_VAR_FALLBACK" > "$CA_PATH"
            echo "::warning::CA cert resolved from the transitional per-repo vars[${PROJECT_SEG}_CA_CERT] fallback (registry miss). Set it in the registry via 'macf certs init' to close this gap — see macf-actions#66."
          else
            echo "::error::CA cert not found in the registry (${PROJECT_SEG}_CA_CERT under ${REG_PATH}) and no per-repo vars[${PROJECT_SEG}_CA_CERT] fallback is set. See macf-actions#66." >&2
            exit 1
          fi
          echo "path=${CA_PATH}" >> "$GITHUB_OUTPUT"

      - name: Route CI completion to agent-authored PRs (mTLS POST)
        env:
          REG_TOKEN: ${{ steps.registry-token.outputs.token }}
          REG_PATH: ${{ inputs.registry-api-path }}
          CA_CERT_PATH: ${{ steps.ca-cert.outputs.path }}
        run: |
          set -euo pipefail

          case "$CHECK_SUITE_CONCLUSION" in
            success|failure|timed_out|action_required) ;;
            *) echo "Conclusion '$CHECK_SUITE_CONCLUSION' not actionable; skipping"; exit 0 ;;
          esac

          PR_NUMBERS=$(gh api "/repos/${REPO}/commits/${CHECK_SUITE_HEAD_SHA}/pulls" --jq '.[] | .number')
          [ -z "$PR_NUMBERS" ] && { echo "No PR for SHA ${CHECK_SUITE_HEAD_SHA}; skipping"; exit 0; }

          TMPDIR=$(mktemp -d); trap 'rm -rf "$TMPDIR"' EXIT
          cp "$CA_CERT_PATH" "$TMPDIR/ca.pem"
          echo "$ROUTING_CLIENT_CERT" | base64 -d > "$TMPDIR/c.pem"
          echo "$ROUTING_CLIENT_KEY"  | base64 -d > "$TMPDIR/k.pem"
          chmod 600 "$TMPDIR/k.pem"

          for PR_NUMBER in $PR_NUMBERS; do
            PR_JSON=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}")
            PR_STATE=$(echo "$PR_JSON" | jq -r '.state')
            PR_DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
            PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login')
            PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')

            # Staleness guard: a force-push during CI produces a check_suite
            # on the OLD head_sha. If it completes after new CI started, the
            # notification would reference outdated status. See #6 body for
            # the force-push race-condition write-up.
            [ "$PR_HEAD_SHA" != "$CHECK_SUITE_HEAD_SHA" ] && { echo "PR #${PR_NUMBER} HEAD moved past ${CHECK_SUITE_HEAD_SHA} (now ${PR_HEAD_SHA}); skipping stale check_suite"; continue; }
            [ "$PR_STATE" != "open" ] && { echo "PR #${PR_NUMBER} state=${PR_STATE}; skipping"; continue; }
            [ "$PR_DRAFT" = "true" ] && { echo "PR #${PR_NUMBER} is a draft; skipping"; continue; }

            AGENT_NAME=""
            for CANDIDATE in $(echo "$AGENTS" | jq -r 'keys[]'); do
              APP_NAME=$(echo "$AGENTS" | jq -r --arg a "$CANDIDATE" '.[$a].app_name // empty')
              [ "$PR_AUTHOR" = "${APP_NAME}[bot]" ] && { AGENT_NAME="$CANDIDATE"; break; }
            done
            [ -z "$AGENT_NAME" ] && { echo "PR #${PR_NUMBER} author '${PR_AUTHOR}' not a registered agent; skipping"; continue; }

            # Same inline-lookup justification as route-by-mention: loop-driven.
            AGENT_SEG=$(printf '%s' "$AGENT_NAME" | tr '[:lower:]-' '[:upper:]_')
            VAR_NAME="${PROJECT_SEG}_AGENT_${AGENT_SEG}"
            set +e
            ENTRY=$(GH_TOKEN="$REG_TOKEN" gh api "${REG_PATH}/actions/variables/${VAR_NAME}" --jq '.value' 2>/dev/null)
            API_RC=$?
            set -e
            if [ "$API_RC" -ne 0 ] || [ -z "$ENTRY" ]; then
              echo "Registry miss for ${AGENT_NAME} (${VAR_NAME}); skipping CI-completion route"
              continue
            fi
            HOST=$(echo "$ENTRY" | jq -r '.host // empty')
            PORT=$(echo "$ENTRY" | jq -r '.port // empty')
            if [ -z "$HOST" ] || [ -z "$PORT" ]; then
              echo "Registry entry ${VAR_NAME} missing host or port; skipping" >&2
              continue
            fi

            PR_URL="https://github.com/${REPO}/pull/${PR_NUMBER}"
            if [ "$CHECK_SUITE_CONCLUSION" = "success" ]; then
              MESSAGE="PR #${PR_NUMBER} (\"${PR_TITLE}\"): CI SUCCESS. ${PR_URL}. Next: merge if you're the author."
            else
              FAILING=$(gh api "/repos/${REPO}/check-suites/${CHECK_SUITE_ID}/check-runs" \
                --jq '.check_runs[] | select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="action_required") | .name' | head -1)
              if [ -n "$FAILING" ]; then
                MESSAGE="PR #${PR_NUMBER} (\"${PR_TITLE}\"): CI FAILED. First failing check: '${FAILING}'. ${PR_URL}. Next: investigate + push fix."
              else
                MESSAGE="PR #${PR_NUMBER} (\"${PR_TITLE}\"): CI FAILED (${CHECK_SUITE_CONCLUSION}). ${PR_URL}. Next: investigate + push fix."
              fi
            fi

            # CI-completion payload shape matches CiCompletionPayloadSchema
            # in groundnuty/macf src/types.ts (landed in macf#122 / 4e2be5b).
            # failing_check_name is null on success, string on failure paths.
            # The empty-string → null conversion is needed because `jq --arg`
            # always produces a string; empty-string is how we indicate "no
            # failing check" across the bash → jq boundary.
            PAYLOAD=$(jq -n \
              --arg type "ci_completion" --arg source "ci_completion" \
              --argjson pr_number "$PR_NUMBER" --arg pr_title "$PR_TITLE" \
              --arg pr_url "$PR_URL" --arg conclusion "$CHECK_SUITE_CONCLUSION" \
              --arg failing_check_name "${FAILING:-}" --arg message "$MESSAGE" \
              '{
                type: $type,
                source: $source,
                pr_number: $pr_number,
                pr_title: $pr_title,
                pr_url: $pr_url,
                conclusion: $conclusion,
                failing_check_name: (if $failing_check_name == "" then null else $failing_check_name end),
                message: $message
              }')

            set +e
            HTTP_CODE=$(curl --silent --show-error \
              --cacert "$TMPDIR/ca.pem" --cert "$TMPDIR/c.pem" --key "$TMPDIR/k.pem" \
              --max-time 30 -X POST "https://${HOST}:${PORT}/notify" \
              -H 'Content-Type: application/json' -d "$PAYLOAD" \
              -o "$TMPDIR/r.txt" -w '%{http_code}')
            CURL_RC=$?
            set -e

            if [ "$CURL_RC" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
              echo "Routed CI completion for PR #${PR_NUMBER} to ${AGENT_NAME} via mTLS"
            else
              echo "Agent ${AGENT_NAME} unreachable via mTLS for PR #${PR_NUMBER} (rc=$CURL_RC HTTP=$HTTP_CODE); not marking agent-offline on CI-completion path"
            fi
          done

  # ─── ROUTE BY PR REVIEW STATE ───
  # Notifies the PR author's channel-server when a reviewer submits an
  # APPROVED or CHANGES_REQUESTED review on the PR. Closes the LGTM→merge
  # handoff gap that pre-#39 routing didn't cover: route-by-mention only
  # fires when the review body contains a routing-active @<author>[bot]
  # mention; many reviewers approve without explicit @-mention (per
  # mention-routing-hygiene §3 "addressing context" guidance). The
  # structural state-change IS the notification — PR author wakes to
  # merge (on approved) or fix (on changes_requested).
  #
  # Filter: action=submitted (excludes edited + dismissed); state in
  # {approved, changes_requested} (commented + dismissed are out-of-scope
  # at v3.3.0 per macf-actions#39 design Q3 disposition).
  #
  # Receiver-side schema (groundnuty/macf#293, v0.2.7+):
  #   PrReviewStatePayloadSchema in @groundnuty/macf-core
  #
  # #57 (silent-fallback Instance 13 structural retirement): also routes
  # to every registered agent @mentioned in the review BODY, not just the
  # PR author — a reviewer can unblock a third-party gate-owner with the
  # same review. Reuses route-by-mention's code-context-strip + fixed-
  # string @mention match (see that job for the ReDoS-safety rationale).
  # Recipient set = {author} ∪ {body-mentioned registered agents},
  # deduped, so an author who is also self-mentioned gets exactly one
  # pr_review_state POST.
  #
  # #58 (in-run dedup companion): exposes `outputs.notified` — the
  # space-separated list of agent-label recipients actually targeted this
  # run — so route-by-mention can skip re-notifying them via a `mention`
  # for the SAME pull_request_review event.
  route-by-pr-review-state:
    needs: [config, pick-runner]
    if: >
      (github.event_name == 'pull_request_review') &&
      (github.event.action == 'submitted') &&
      (
        github.event.review.state == 'approved' ||
        github.event.review.state == 'changes_requested'
      )
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    outputs:
      notified: ${{ steps.route.outputs.notified }}
    env:
      AGENTS: ${{ needs.config.outputs.agents }}
      # macf-actions#66: TRANSITIONAL fallback only — the per-repo `vars[...]`
      # copy of the CA cert. The registry (see the "Resolve project CA cert"
      # step below) is now the primary source, same as host/port.
      PROJECT_CA_CERT_REPO_VAR_FALLBACK: ${{ vars[format('{0}_CA_CERT', needs.config.outputs.project-seg)] }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      REVIEW_STATE: ${{ github.event.review.state }}
      REVIEWER_LOGIN: ${{ github.event.review.user.login }}
      REVIEW_URL: ${{ github.event.review.html_url }}
      REVIEW_BODY: ${{ github.event.review.body }}
      PROJECT_SEG: ${{ needs.config.outputs.project-seg }}
    steps:
      # groundnuty/macf-actions#1169: resolves ROUTING_CLIENT_CERT/KEY (and
      # the other four routing secrets) from either MACF_ROUTING_BUNDLE or
      # the legacy six — see that step's own doc for the full contract.
      # Deliberately NOT in this job's `env:` block above (unlike the
      # pre-#1169 shape): a job-level `env: ROUTING_CLIENT_CERT: ${{
      # secrets.ROUTING_CLIENT_CERT }}` would just be an empty string for a
      # bundle-only caller, and this step's $GITHUB_ENV write is the ONLY
      # source of truth for these names in this job — no double-definition
      # to keep straight.
      - name: Resolve routing secrets (prefer MACF_ROUTING_BUNDLE — groundnuty/macf-actions#1169)
        id: resolve-routing-secrets
        env:
          BUNDLE: ${{ secrets.MACF_ROUTING_BUNDLE }}
          IN_MACF_ROUTING_APP_ID: ${{ secrets.MACF_ROUTING_APP_ID }}
          IN_MACF_ROUTING_APP_KEY: ${{ secrets.MACF_ROUTING_APP_KEY }}
          IN_ROUTING_CLIENT_CERT: ${{ secrets.ROUTING_CLIENT_CERT }}
          IN_ROUTING_CLIENT_KEY: ${{ secrets.ROUTING_CLIENT_KEY }}
          IN_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          IN_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          # A fleet that hasn't declared Tailscale (apply-routing-secrets.ts's
          # 'not-required' leg — transport.tailscale_oauth_required defaults
          # to false, so this is the COMMON case) never gets TS_OAUTH_*
          # published as repo secrets. On the self-hosted `macf-vm` runner
          # (already tailnet-joined, macf-actions#64) that's fine — Connect
          # to Tailscale below never runs, so the fallback branch must not
          # require TS_OAUTH_* when this run won't actually consume it.
          TAILNET_NEEDED: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: |
          set -euo pipefail

          # groundnuty/macf#1169 / groundnuty/macf-actions#1169: a caller
          # generated by macf#1118+ passes ONE secret, MACF_ROUTING_BUNDLE
          # (base64(JSON) of these same six values, keyed by their own
          # secret names — apply-routing-secrets.ts::packRoutingBundle).
          # A legacy caller passes the six individually via
          # `secrets: inherit` or explicit listing. This step is the ONE
          # place that decides which source feeds every LATER step in
          # this job (they read the six under their original names,
          # either as a plain OS env var in `run:` steps, or via
          # `${{ env.NAME }}` in a `uses:` step's `with:` block).
          #
          # Additive, never a replacement: the bundle wins whenever the
          # caller supplied it (a present-but-malformed bundle fails
          # LOUD here rather than silently falling back to the six, even
          # if those happen to be present too — a bundle-packing bug
          # must never hide behind a coincidental fallback). The six are
          # the fallback ONLY when the caller supplied no bundle at all.
          # A caller supplying NEITHER fails loudly, naming exactly which
          # secret(s) are missing, before Tailscale connect or the
          # App-token mint ever run — never a partial run on empty
          # secrets (silent-fallback-hazards.md Pattern D: GitHub
          # substitutes empty string for an unsupplied secret, and an
          # empty-string routing secret must never be handed to curl/
          # create-github-app-token as if it were real).
          #
          # Never echoes a secret value — only names/counts appear in any
          # echo or ::error:: below. Every extracted value is masked
          # (line-by-line — GitHub's ::add-mask:: does not reliably
          # redact a value containing embedded newlines, and
          # MACF_ROUTING_APP_KEY is raw multi-line PEM; see
          # actions/runner#475) BEFORE it is written to $GITHUB_ENV.

          NAMES="MACF_ROUTING_APP_ID MACF_ROUTING_APP_KEY ROUTING_CLIENT_CERT ROUTING_CLIENT_KEY TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET"

          emit_secret() {
            # $1=name $2=value. Masks every line of $2 individually (a
            # single ::add-mask:: call on a multi-line string does not
            # reliably mask it — GH's masking is word/line-delimited),
            # then writes NAME to $GITHUB_ENV behind a random per-call
            # delimiter (GitHub's documented multiline-value pattern) so
            # a PEM value's own content can never collide with the
            # heredoc terminator.
            local name="$1" value="$2" delim line
            while IFS= read -r line || [ -n "$line" ]; do
              [ -n "$line" ] && echo "::add-mask::${line}"
            done <<< "$value"
            delim="ROUTING_SECRET_EOF_${name}_${RANDOM}${RANDOM}_$$"
            {
              echo "${name}<<${delim}"
              printf '%s\n' "$value"
              echo "$delim"
            } >> "$GITHUB_ENV"
          }

          if [ -n "${BUNDLE:-}" ]; then
            echo "routing secrets: MACF_ROUTING_BUNDLE supplied — bundle mode"
            if ! DECODED=$(printf '%s' "$BUNDLE" | base64 -d 2>/dev/null); then
              echo "::error::MACF_ROUTING_BUNDLE is not valid base64 — refusing to route on an unreadable bundle"
              exit 1
            fi
            if ! printf '%s' "$DECODED" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::MACF_ROUTING_BUNDLE decoded but is not a JSON object — refusing to route on a malformed bundle"
              exit 1
            fi
            MISSING=""
            for NAME in $NAMES; do
              VALUE=$(printf '%s' "$DECODED" | jq -r --arg k "$NAME" '.[$k] // empty')
              if [ -z "$VALUE" ]; then
                MISSING="${MISSING:+$MISSING, }$NAME"
                continue
              fi
              emit_secret "$NAME" "$VALUE"
            done
            unset DECODED
            if [ -n "$MISSING" ]; then
              echo "::error::MACF_ROUTING_BUNDLE is missing required key(s): $MISSING — refusing to route on a partial bundle"
              exit 1
            fi
            echo "routing secrets: unpacked all six values from MACF_ROUTING_BUNDLE"
          else
            echo "routing secrets: MACF_ROUTING_BUNDLE not supplied — falling back to the six individual secrets"
            MISSING=""
            for NAME in $NAMES; do
              case "$NAME" in
                MACF_ROUTING_APP_ID)  VALUE="${IN_MACF_ROUTING_APP_ID:-}" ;;
                MACF_ROUTING_APP_KEY) VALUE="${IN_MACF_ROUTING_APP_KEY:-}" ;;
                ROUTING_CLIENT_CERT)  VALUE="${IN_ROUTING_CLIENT_CERT:-}" ;;
                ROUTING_CLIENT_KEY)   VALUE="${IN_ROUTING_CLIENT_KEY:-}" ;;
                TS_OAUTH_CLIENT_ID)   VALUE="${IN_TS_OAUTH_CLIENT_ID:-}" ;;
                TS_OAUTH_SECRET)      VALUE="${IN_TS_OAUTH_SECRET:-}" ;;
              esac
              if [ -z "$VALUE" ]; then
                # TS_OAUTH_* is legitimately absent on a fleet that hasn't
                # declared Tailscale (the COMMON case — see this step's
                # `env:` doc for TAILNET_NEEDED). Only fail on a missing
                # TS_OAUTH_* when this run will actually attempt the
                # Tailscale connect; MACF_ROUTING_APP_ID/KEY and
                # ROUTING_CLIENT_CERT/KEY have no such carve-out.
                if { [ "$NAME" = "TS_OAUTH_CLIENT_ID" ] || [ "$NAME" = "TS_OAUTH_SECRET" ]; } \
                  && [ "${TAILNET_NEEDED:-true}" != "true" ]; then
                  echo "routing secrets: $NAME not supplied and not needed this run (self-hosted runner skips Tailscale connect) — leaving unset"
                  continue
                fi
                MISSING="${MISSING:+$MISSING, }$NAME"
                continue
              fi
              emit_secret "$NAME" "$VALUE"
            done
            if [ -n "$MISSING" ]; then
              echo "::error::Neither MACF_ROUTING_BUNDLE nor the following individual routing secret(s) were supplied: $MISSING — this caller cannot route. Pass MACF_ROUTING_BUNDLE (preferred, groundnuty/macf#1112) or all six secrets individually."
              echo "::error::Likely cause if you're a cross-org/enterprise caller: 'secrets: inherit' only propagates within the SAME organization/enterprise (GitHub docs) — see groundnuty/macf#1338, where a cross-org caller had all six secrets on its OWN repo but none reached this call. Pass the routing secrets explicitly in your caller workflow's 'secrets:' block, or supply MACF_ROUTING_BUNDLE."
              exit 1
            fi
            echo "routing secrets: resolved all six from the individually-supplied secrets"
          fi

      # macf-actions#64: the self-hosted `macf-vm` runner is ALREADY a
      # tailnet node (persistent VM) — re-running the ephemeral-runner
      # tailnet-join here is both redundant and observed to hard-fail
      # (`exit 1` at this step) on that runner, killing the job before
      # its mTLS POST. Skip join/assert/wait when origin-routing (#59)
      # picked the self-hosted runner; only github-hosted (ephemeral,
      # off-tailnet by default) needs to join. `needs.pick-runner.outputs.labels`
      # is a job output (always a string at this context — c.f. the
      # `fromJSON()` at this job's `runs-on:`), holding either the literal
      # string `"ubuntu-latest"` or `["self-hosted","macf-vm"]`; `contains()`
      # does a substring match against that raw string.
      - name: Connect to Tailscale
        if: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci-runner

      - name: Assert tailnet is up (Instance 11 — connect can exit 0 on retry-exhaustion)
        if: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: |
          tailscale status --json | jq -e '.BackendState == "Running"' >/dev/null \
            || { echo "::error::tailnet did not come up — BackendState != Running.";
                 echo "::error::The connect action may have exhausted retries and exited 0 anyway (bad TS_OAUTH_* or tag/ACL mismatch → Status 400 on every retry).";
                 tailscale status || true; exit 1; }
          echo "✓ tailnet up (BackendState=Running)"

      - name: Wait for Tailscale network
        if: ${{ !contains(needs.pick-runner.outputs.labels, 'self-hosted') }}
        run: sleep 10

      - name: Mint registry-read token
        id: registry-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.MACF_ROUTING_APP_ID }}
          private-key: ${{ env.MACF_ROUTING_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve project CA cert (registry primary, repo-var fallback)
        id: ca-cert
        # macf-actions#66: see route-by-label's identically-named step for
        # the full rationale — registry primary (same registry-read token
        # minted above), per-repo vars[...] transitional fallback,
        # both-empty fails loud (groundnuty/macf#799/#806 outage class).
        env:
          GH_TOKEN: ${{ steps.registry-token.outputs.token }}
          REG_PATH: ${{ inputs.registry-api-path }}
        run: |
          set -euo pipefail
          CA_PATH=$(mktemp "${RUNNER_TEMP}/project-ca.XXXXXX.pem")
          if REGISTRY_CA=$(gh api "${REG_PATH}/actions/variables/${PROJECT_SEG}_CA_CERT" --jq '.value' 2>/dev/null) && [ -n "$REGISTRY_CA" ]; then
            printf '%s' "$REGISTRY_CA" > "$CA_PATH"
            echo "CA cert resolved from registry (${PROJECT_SEG}_CA_CERT)"
          elif [ -n "${PROJECT_CA_CERT_REPO_VAR_FALLBACK:-}" ]; then
            printf '%s' "$PROJECT_CA_CERT_REPO_VAR_FALLBACK" > "$CA_PATH"
            echo "::warning::CA cert resolved from the transitional per-repo vars[${PROJECT_SEG}_CA_CERT] fallback (registry miss). Set it in the registry via 'macf certs init' to close this gap — see macf-actions#66."
          else
            echo "::error::CA cert not found in the registry (${PROJECT_SEG}_CA_CERT under ${REG_PATH}) and no per-repo vars[${PROJECT_SEG}_CA_CERT] fallback is set. See macf-actions#66." >&2
            exit 1
          fi
          echo "path=${CA_PATH}" >> "$GITHUB_OUTPUT"

      - name: Route PR review state to the deliberate-review-engagement set (mTLS POST)
        id: route
        env:
          REG_TOKEN: ${{ steps.registry-token.outputs.token }}
          REG_PATH: ${{ inputs.registry-api-path }}
          CA_CERT_PATH: ${{ steps.ca-cert.outputs.path }}
        run: |
          set -euo pipefail
          set -f  # macf#56: disable globbing — reviewer/requested logins contain `[bot]`; the unquoted `for login in $…_LOGINS` loops below must not glob-expand it

          # ── Build the recipient set (macf#62 — full Instance-13
          # closure): {author} ∪ {body-@mentioned} ∪ {formal reviewers}
          # ∪ {requested reviewers}. All four sources fold into the
          # same deduped RECIPIENTS list, which flows into the same
          # `notified` output route-by-mention's #58 dedup reads —
          # extending the SET, not adding a second emit path.
          #
          # RECIPIENTS is a space-delimited list of registry-key agent
          # names (e.g. "code-agent science-agent"). Membership check is
          # exact-token (space-bounded substring), safe regardless of
          # hyphens in agent names.
          RECIPIENTS=""

          # macf-actions#68: resolve the review SUBMITTER (REVIEWER_LOGIN =
          # github.event.review.user.login) to its registry key so we can
          # exclude the actor from the recipient set. The macf#62 closure
          # folds in FORMAL reviewers — which necessarily includes the login
          # that just submitted THIS review — so without this exclusion the
          # submitting reviewer self-notifies (an echo of its own review;
          # verified on groundnuty/icsoc-2026-code-agent PR #15). Skipping at
          # add_recipient (the single choke-point) covers ALL four sources
          # (author / body-@mention / formal reviewers / requested reviewers),
          # including the rare self-review / self-mention-in-review-body cases.
          # A human/unregistered submitter resolves to "" → guard is inert.
          REVIEWER_AGENT=""
          for CANDIDATE in $(echo "$AGENTS" | jq -r 'keys[]'); do
            APP_NAME=$(echo "$AGENTS" | jq -r --arg a "$CANDIDATE" '.[$a].app_name // empty')
            if [ -n "$APP_NAME" ] && [ "$REVIEWER_LOGIN" = "${APP_NAME}[bot]" ]; then
              REVIEWER_AGENT="$CANDIDATE"
              break
            fi
          done

          add_recipient() {
            # #68: never self-notify the reviewer who just submitted this review.
            [ -n "$REVIEWER_AGENT" ] && [ "$1" = "$REVIEWER_AGENT" ] && return 0
            case " $RECIPIENTS " in
              *" $1 "*) ;; # already present — dedupe (#58 same-recipient case)
              *) RECIPIENTS="${RECIPIENTS:+$RECIPIENTS }$1" ;;
            esac
          }

          # Resolve a `<bot-name>[bot]` login to its registry key via
          # the agents map's app_name field, and add_recipient it if
          # found. Non-agent logins (human reviewers, unregistered
          # bots) are silently dropped — same registry-miss behavior
          # as the pre-existing author-resolution loop below.
          add_recipient_by_login() {
            login="$1"
            for CANDIDATE in $(echo "$AGENTS" | jq -r 'keys[]'); do
              APP_NAME=$(echo "$AGENTS" | jq -r --arg a "$CANDIDATE" '.[$a].app_name // empty')
              if [ -n "$APP_NAME" ] && [ "$login" = "${APP_NAME}[bot]" ]; then
                add_recipient "$CANDIDATE"
                return 0
              fi
            done
          }

          # Resolve PR_AUTHOR (`<bot-name>[bot]`) → AGENT_NAME via the
          # agents map's app_name field (same loop as route-by-ci-
          # completion). Human-authored PRs have no channel-server, so
          # a non-agent author simply isn't added — falls through to the
          # other recipient sources below (if any).
          add_recipient_by_login "$PR_AUTHOR"

          # #57: also route to every registered agent @mentioned in the
          # review BODY. Mirrors route-by-mention's code-context strip +
          # fixed-string match exactly (groundnuty/macf-actions#33 +
          # #13 ReDoS-safety rationale — see that job for the full
          # write-up). $REVIEW_BODY is passed via env (not interpolated
          # into run:), so arbitrary reviewer-controlled content is safe.
          BODY_CLEAN=$(printf '%s' "${REVIEW_BODY:-}" | awk '
            /^```/ { inside_fence = !inside_fence; next }
            inside_fence { next }
            { print }
          ' | sed -E 's/`[^`]*`//g')

          for CANDIDATE in $(echo "$AGENTS" | jq -r 'keys[]'); do
            APP_NAME=$(echo "$AGENTS" | jq -r --arg a "$CANDIDATE" '.[$a].app_name // empty')
            if printf '%s' "$BODY_CLEAN" | grep -qF -e "@${CANDIDATE}[bot]" -e "@${APP_NAME}[bot]"; then
              add_recipient "$CANDIDATE"
            fi
          done

          # macf#62: also route to every agent who has submitted a
          # FORMAL REVIEW on this PR (any state — APPROVED, CHANGES_
          # REQUESTED, COMMENTED — a co-reviewer who left a COMMENTED
          # review is deliberately engaged too), and every agent listed
          # as a REQUESTED reviewer who hasn't reviewed yet. This is the
          # gap #57 left open: the motivating Instance-13 incident was a
          # gate-owner who had formally APPROVED but was never
          # @mentioned in any body — author + body-mentions alone would
          # still miss them. GH_TOKEN here is the job's own
          # secrets.GITHUB_TOKEN (already in env), sufficient to read
          # reviews/requested_reviewers on an in-repo PR.
          # INCLUDE-ALL-REVIEW-STATES BY DESIGN: /reviews returns every state
          # (APPROVED / CHANGES_REQUESTED / COMMENTED / DISMISSED). We notify
          # them ALL — the Instance-13 lesson is "never MISS a gate-owner", and
          # a spurious notify to a dismissed reviewer is far cheaper than missing
          # a live one. Do NOT "tighten" this to APPROVED-only — that re-opens
          # the Instance-13 miss (silent-fallback-hazards.md #13, macf#62).
          REVIEWER_LOGINS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --paginate --jq '.[].user.login' 2>/dev/null || true)
          for login in $REVIEWER_LOGINS; do
            add_recipient_by_login "$login"
          done

          REQUESTED_LOGINS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            --jq '.users[].login' 2>/dev/null || true)
          for login in $REQUESTED_LOGINS; do
            add_recipient_by_login "$login"
          done

          if [ -z "$RECIPIENTS" ]; then
            echo "PR #${PR_NUMBER}: no registered agent among author, body-@mentions, formal reviewers, or requested reviewers; skipping (review-state events only route to registered agents)"
            echo "notified=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reviewer identity is informational (rendered in the
          # notification surface) but not required to be a registered
          # agent. Reviewers can be any GitHub identity.

          TMPDIR=$(mktemp -d); trap 'rm -rf "$TMPDIR"' EXIT
          cp "$CA_CERT_PATH" "$TMPDIR/ca.pem"
          echo "$ROUTING_CLIENT_CERT" | base64 -d > "$TMPDIR/c.pem"
          echo "$ROUTING_CLIENT_KEY"  | base64 -d > "$TMPDIR/k.pem"
          chmod 600 "$TMPDIR/k.pem"

          NOTIFIED=""
          for AGENT_NAME in $RECIPIENTS; do
            # Same inline-lookup justification as route-by-mention /
            # route-by-ci-completion: loop-driven path uses the same
            # transform as .github/actions/resolve-agent-endpoint
            # (test/resolve-agent-endpoint-transform.sh).
            AGENT_SEG=$(printf '%s' "$AGENT_NAME" | tr '[:lower:]-' '[:upper:]_')
            VAR_NAME="${PROJECT_SEG}_AGENT_${AGENT_SEG}"

            set +e
            ENTRY=$(GH_TOKEN="$REG_TOKEN" gh api "${REG_PATH}/actions/variables/${VAR_NAME}" --jq '.value' 2>/dev/null)
            API_RC=$?
            set -e
            if [ "$API_RC" -ne 0 ] || [ -z "$ENTRY" ]; then
              echo "Registry miss for ${AGENT_NAME} (${VAR_NAME}); skipping pr_review_state route"
              continue
            fi
            HOST=$(echo "$ENTRY" | jq -r '.host // empty')
            PORT=$(echo "$ENTRY" | jq -r '.port // empty')
            if [ -z "$HOST" ] || [ -z "$PORT" ]; then
              echo "Registry entry ${VAR_NAME} missing host or port; skipping" >&2
              continue
            fi

            # This agent is a confirmed recipient of pr_review_state for
            # this run — record it BEFORE attempting delivery so #58's
            # dedup output reflects "who review-state targeted", not "who
            # it successfully reached" (route-by-mention would hit the
            # same unreachable host/port anyway; letting it retry buys
            # nothing and reintroduces the double-notify #58 exists to
            # prevent).
            NOTIFIED="${NOTIFIED:+$NOTIFIED }${AGENT_NAME}"

            # Build PrReviewStatePayloadSchema-conformant payload (per
            # @groundnuty/macf-core v0.2.7+; receivers on older versions
            # HTTP-400-reject without harm to other notification types —
            # backward-compat protected by the schema's wider acceptance
            # path on NotifyPayloadSchema).
            PAYLOAD=$(jq -n \
              --arg type "pr_review_state" \
              --arg review_state "$REVIEW_STATE" \
              --arg reviewer_login "$REVIEWER_LOGIN" \
              --argjson pr_number "$PR_NUMBER" \
              --arg pr_url "$PR_URL" \
              --arg review_url "$REVIEW_URL" \
              '{type: $type, review_state: $review_state, reviewer_login: $reviewer_login, pr_number: $pr_number, pr_url: $pr_url, review_url: $review_url}')

            set +e
            HTTP_CODE=$(curl --silent --show-error \
              --cacert "$TMPDIR/ca.pem" --cert "$TMPDIR/c.pem" --key "$TMPDIR/k.pem" \
              --max-time 30 -X POST "https://${HOST}:${PORT}/notify" \
              -H 'Content-Type: application/json' -d "$PAYLOAD" \
              -o "$TMPDIR/r.txt" -w '%{http_code}')
            CURL_RC=$?
            set -e

            if [ "$CURL_RC" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
              echo "Routed pr_review_state (${REVIEW_STATE}) on PR #${PR_NUMBER} to ${AGENT_NAME} via mTLS"
            elif [ "$HTTP_CODE" = "400" ]; then
              # Receiver-version-skew: receiver is on @groundnuty/macf-core
              # < v0.2.7 (no pr_review_state in NotifyTypeSchema). Log +
              # continue; non-fatal (the gh-driven event is informational,
              # not a state-mutating step like /sign).
              echo "Agent ${AGENT_NAME} returned HTTP 400 (likely macf-core < v0.2.7 — pre-pr_review_state schema); skipping"
            else
              echo "Agent ${AGENT_NAME} unreachable via mTLS for PR #${PR_NUMBER} review (rc=$CURL_RC HTTP=$HTTP_CODE); skipping (review-state events don't mark agent-offline)"
            fi
          done

          echo "notified=${NOTIFIED}" >> "$GITHUB_OUTPUT"

  # ─── LABEL CLEANUP ON CLOSE ───
  cleanup-labels:
    needs: pick-runner
    if: >
      (github.event_name == 'issues') &&
      (github.event.action == 'closed')
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Remove status labels
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          for LABEL in in-progress in-review blocked; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" 2>/dev/null || true
          done
          echo "Cleaned status labels from issue #${ISSUE_NUMBER}"
